services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<'CONF'
        {"identities":[{"name":"admin","credentials":[{"accessKey":"admin","secretKey":"admin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweed_data:/data

  agent-base:
    build:
      context: ./docker/agent-base
    image: agent-base:latest
    entrypoint: ["echo", "agent-base image built"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
    # No host port publish: Coolify's Traefik proxy routes the domain to this
    # container over the internal network (ports_exposes=3000). Publishing host
    # :3000 collides with the production app when both run on the same server.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    command: ["sh", "-c", "node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      POSTGRES_URL: ${POSTGRES_URL:-}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-admin}
      S3_REGION: ${S3_REGION:-us-east-1}
      # GitHub integration (optional)
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      agent-base:
        condition: service_completed_successfully

  # vaerksted-auth — design doc docs/design/vaerksted-auth-and-sync.md §4, §10.
  # Standalone identity service, own Postgres schema, no code-level
  # dependency on Maskin's own DB package. Deliberately NOT dependent on the
  # local `postgres` compose service above: VAERKSTED_AUTH_DATABASE_URL
  # points at the separate, dedicated Supabase-hosted Postgres project
  # (§6a), not this stack's local dev Postgres container.
  vaerksted-auth:
    build:
      context: .
      dockerfile: apps/vaerksted-auth/Dockerfile
    # No host port publish: Coolify's Traefik proxy routes the domain to this
    # container over the internal network, same as the `app` service above.
    environment:
      VAERKSTED_AUTH_DATABASE_URL: ${VAERKSTED_AUTH_DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VAERKSTED_AUTH_SIGNING_PRIVATE_KEY: ${VAERKSTED_AUTH_SIGNING_PRIVATE_KEY:-}
      VAERKSTED_AUTH_SIGNING_PUBLIC_KEY: ${VAERKSTED_AUTH_SIGNING_PUBLIC_KEY:-}
      VAERKSTED_AUTH_SESSION_JWT_SECRET: ${VAERKSTED_AUTH_SESSION_JWT_SECRET:-}
      PORT: "3001"
      NODE_ENV: production

  # vaerksted-sync — design doc docs/design/vaerksted-auth-and-sync.md §9, §10.
  # Standalone relay service, own Postgres schema, no code-level dependency
  # on Maskin's own DB package or on vaerksted-auth's internals — it
  # authenticates callers by verifying device certs locally against
  # VAERKSTED_AUTH_SIGNING_PUBLIC_KEY, never by calling vaerksted-auth over
  # the network per request (§9). Deliberately NOT dependent on the local
  # `postgres` compose service above: VAERKSTED_SYNC_DATABASE_URL points at
  # the same dedicated Supabase-hosted Postgres project vaerksted-auth uses,
  # under its own logical schema — not this stack's local dev Postgres
  # container.
  vaerksted-sync:
    build:
      context: .
      dockerfile: apps/vaerksted-sync/Dockerfile
    # No host port publish: Coolify's Traefik proxy routes the domain to this
    # container over the internal network, same as the `app` and
    # `vaerksted-auth` services above. WebSocket upgrades (GET /sync/ws)
    # route through the same domain/port as the rest of this service's HTTP
    # routes — no separate port needed.
    environment:
      VAERKSTED_SYNC_DATABASE_URL: ${VAERKSTED_SYNC_DATABASE_URL:-}
      VAERKSTED_AUTH_SIGNING_PUBLIC_KEY: ${VAERKSTED_AUTH_SIGNING_PUBLIC_KEY:-}
      PORT: "3002"
      NODE_ENV: production

volumes:
  pgdata:
  seaweed_data:
