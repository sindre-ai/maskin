services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<'CONF'
        {"identities":[{"name":"admin","credentials":[{"accessKey":"admin","secretKey":"admin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -metricsPort=9327 -metricsIp=0.0.0.0
    volumes:
      - seaweed_data:/data
    # Prometheus metrics, scraped by Alloy on the host.
    # See observability/coolify-host/ for the collector config and the
    # disk-headroom alert this feeds.
    #
    # -metricsPort turns the endpoint ON. Without it `weed` serves no
    # /metrics at all — the port flag is the switch, not just the address,
    # so there is nothing to scrape on a default install.
    #
    # -metricsIp=0.0.0.0 is NOT redundant. It defaults to `-ip.bind`, which
    # for `weed server` resolves to the container's own eth0 address (e.g.
    # 10.0.0.3), not localhost. VERIFIED 2026-08-27 on the Coolify box: with
    # the port flag alone, `wget http://127.0.0.1:9327/metrics` from inside
    # the container is refused while the same request to the container IP
    # succeeds. Binding 0.0.0.0 removes the dependency on an address that
    # changes whenever Docker reassigns the subnet.
    ports:
      # Loopback-only on purpose. The endpoint is unauthenticated and exposes
      # bucket/volume topology, so the bind address is the security boundary —
      # the same reasoning as agent-server's loopback /metrics listener. Alloy
      # runs on this host, so it costs nothing.
      - "127.0.0.1:9327:9327"

  agent-base:
    build:
      context: ./docker/agent-base
    image: agent-base:latest
    entrypoint: ["echo", "agent-base image built"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
    # No host port publish: Coolify's Traefik proxy routes the domain to this
    # container over the internal network (ports_exposes=3000). Publishing host
    # :3000 collides with the production app when both run on the same server.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    command: ["sh", "-c", "node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      POSTGRES_URL: ${POSTGRES_URL:-}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-admin}
      S3_REGION: ${S3_REGION:-us-east-1}
      # GitHub integration (optional)
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      agent-base:
        condition: service_completed_successfully

volumes:
  pgdata:
  seaweed_data:
