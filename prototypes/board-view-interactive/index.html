<!DOCTYPE html>
<!--
  Board View — Interactive Prototype

  Self-contained interactive mockup of the Maskin Objects-page Board View
  (parent bet: "Objects Page — Board View (Kanban)" / b761a26b).

  Substrate test for bet 3132b9fe ("Design-agent prototypes don't expose
  interaction bugs until after build"). The static HTML mockup that informed
  the Board View bet missed the interaction-layer bugs Sebastian flagged
  post-ship (insight eb54b637: card drag errors, choppy scroll). This file
  is the cheapest test that a single self-contained HTML file with inline JS
  is enough to surface those same classes of bugs at design time.

  How to open: double-click index.html in any modern browser. No server,
  no build step, no dependencies. Works fully offline.

  What's wired:
    - 4 status columns (Todo / In progress / In review / Done) with Linear-style
      pill headers and live counts
    - Cards for tasks (draggable), insights (draggable), bets (locked: dashed
      border + lock chip, drag intentionally blocked)
    - Pointer-event drag-to-status with a floating ghost preview
    - Drop = optimistic move + 350ms fake-async commit; 1-in-6 of those is
      forced to fail, triggering a rollback toast and the card snapping back
    - Active-agent indicator: emerald pulsing dot + actor name on cards with
      a live session; amber dot (no halo) on paused sessions
    - Vertical scroll inside columns (each column owns its overflow)
    - Hover states + transitions on cards and column drop targets
    - Live event counter strip at the bottom so reviewers can see what fired

  What's intentionally skipped:
    - Mobile layout (long-press, scroll-snap strip) — desktop only
    - Real persistence — refresh resets the board
    - Keyboard drag — pointer/mouse/touch only
    - Filters, search, the surrounding Display panel from bet 075ef2c0
    - prefers-reduced-motion handling beyond the CSS-level halo freeze
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board View — Interactive Prototype</title>
<style>
  :root {
    --bg: #0e1014;
    --surface: #161a21;
    --surface-2: #1d222b;
    --surface-3: #232a35;
    --border: #2a313d;
    --border-soft: #232a35;
    --text: #e6e8eb;
    --text-muted: #8b94a3;
    --text-dim: #5f6776;
    --accent: #5b9dff;
    --emerald: #34d399;
    --amber: #f5a524;
    --rose: #f87171;
    --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 2px rgba(0,0,0,0.35);
    --shadow-lift: 0 12px 30px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.35);
    --radius: 8px;
    --radius-lg: 12px;
    --col-todo: #8b94a3;
    --col-in_progress: #5b9dff;
    --col-in_review: #c084fc;
    --col-done: #34d399;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    height: 48px;
  }
  .topbar .title { font-weight: 600; letter-spacing: 0.1px; }
  .topbar .sub { color: var(--text-muted); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .topbar .toggle {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
  }
  .topbar .toggle button {
    appearance: none;
    background: transparent;
    color: var(--text-muted);
    border: 0;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  .topbar .toggle button.active {
    background: var(--surface-3);
    color: var(--text);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(260px, 1fr));
    gap: 14px;
    padding: 14px 18px 60px 18px;
    height: calc(100vh - 48px - 32px);
    overflow: hidden;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    min-height: 0;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  .column.drop-target {
    background: var(--surface-2);
    border-color: var(--accent);
  }
  .column.drop-blocked {
    border-color: var(--rose);
  }

  .column-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 12px;
    color: var(--text);
    font-weight: 500;
  }
  .pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--col-todo);
  }
  .column[data-status="todo"] .pill .dot { background: var(--col-todo); }
  .column[data-status="in_progress"] .pill .dot { background: var(--col-in_progress); }
  .column[data-status="in_review"] .pill .dot { background: var(--col-in_review); }
  .column[data-status="done"] .pill .dot { background: var(--col-done); }

  .count { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .column-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: #3a4252 transparent;
  }
  .column-body::-webkit-scrollbar { width: 8px; }
  .column-body::-webkit-scrollbar-thumb { background: #3a4252; border-radius: 4px; }

  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 11px 11px;
    box-shadow: var(--shadow-card);
    cursor: grab;
    transition: transform 100ms ease, box-shadow 100ms ease, border-color 100ms ease;
    position: relative;
  }
  .card:hover {
    border-color: #3a4254;
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .card.dragging {
    opacity: 0.35;
    cursor: grabbing;
  }
  .card.snapping-back {
    animation: snapback 220ms ease;
  }
  .card[data-type="bet"] {
    border-style: dashed;
    border-color: #3a4254;
    cursor: default;
  }
  .card[data-type="bet"]:hover {
    transform: none;
    box-shadow: var(--shadow-card);
  }

  .card-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .type-chip {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface-3);
    color: var(--text-muted);
  }
  .type-chip[data-type="task"] { color: #9ec5ff; background: rgba(91,157,255,0.12); }
  .type-chip[data-type="insight"] { color: #fbbf24; background: rgba(245,165,36,0.12); }
  .type-chip[data-type="bet"] { color: #c084fc; background: rgba(192,132,252,0.12); }

  .lock-chip {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(192,132,252,0.12);
    color: #c084fc;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .card-title {
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
  }
  .card-meta {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 11px;
  }
  .agent-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .agent-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--emerald);
    position: relative;
  }
  .agent-dot.live::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1.5px solid var(--emerald);
    animation: halo 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  }
  .agent-dot.paused { background: var(--amber); }
  .agent-name { color: var(--text); }
  .agent-line { color: var(--text-muted); }

  @keyframes halo {
    0%   { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(2.0); opacity: 0; }
  }
  @keyframes snapback {
    0%   { transform: translate(var(--from-x, 0), var(--from-y, 0)); }
    100% { transform: translate(0, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .agent-dot.live::before { animation: none; opacity: 0.35; }
    .card.snapping-back { animation: none; }
  }

  .ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    width: 240px;
    transform: rotate(1.5deg);
    box-shadow: var(--shadow-lift);
    opacity: 0.95;
    background: var(--surface-2);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 10px 11px;
  }

  .toast-host {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 2000;
    pointer-events: none;
  }
  .toast {
    background: var(--surface-3);
    color: var(--text);
    border: 1px solid var(--border);
    border-left: 3px solid var(--rose);
    padding: 9px 14px;
    border-radius: 6px;
    box-shadow: var(--shadow-lift);
    font-size: 12px;
    min-width: 280px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toast-in 180ms ease;
  }
  .toast.success { border-left-color: var(--emerald); }
  @keyframes toast-in {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  .debug-strip {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 32px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 18px;
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .debug-strip strong { color: var(--text); font-weight: 600; }
  .debug-strip .seg { display: inline-flex; gap: 6px; align-items: center; }
  .debug-strip .seg::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
  }
  .debug-strip .seg.drag::before  { background: var(--accent); }
  .debug-strip .seg.drop::before  { background: var(--emerald); }
  .debug-strip .seg.fail::before  { background: var(--rose); }
  .debug-strip .seg.block::before { background: var(--amber); }

  .banner {
    margin: 0 18px;
    padding: 8px 12px;
    background: rgba(91,157,255,0.07);
    border: 1px solid rgba(91,157,255,0.25);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 0;
    display: none;
  }
  body.has-bets .banner { display: block; }
</style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="title">Objects · Board</div>
      <div class="sub">Tasks · Insights · Bets</div>
    </div>
    <div class="spacer"></div>
    <div class="toggle" role="tablist" aria-label="View mode">
      <button>List</button>
      <button class="active">Board</button>
    </div>
  </header>

  <div class="banner">Bets don't move between columns — gates own their transitions.</div>

  <main class="board" id="board"></main>

  <div class="toast-host" id="toast-host"></div>

  <footer class="debug-strip">
    <span><strong>Interactions log</strong></span>
    <span class="seg drag">drag <strong id="m-drag">0</strong></span>
    <span class="seg drop">commit <strong id="m-drop">0</strong></span>
    <span class="seg fail">rollback <strong id="m-fail">0</strong></span>
    <span class="seg block">blocked <strong id="m-block">0</strong></span>
    <span style="margin-left:auto">Pointer drag · optimistic commit · 1-in-6 forced failure</span>
  </footer>

<script>
/* ---------- data ---------- */
const STATUSES = [
  { id: "todo",        label: "Todo" },
  { id: "in_progress", label: "In progress" },
  { id: "in_review",   label: "In review" },
  { id: "done",        label: "Done" }
];

const CARDS = [
  { id: "t1",  type: "task",    title: "Wire posthog-js into the web app",                       status: "in_progress", agent: { name: "Senior Developer", state: "live",   line: "rerunning lint" } },
  { id: "t2",  type: "task",    title: "BoardCard primitive — reuse Object Card metadata",       status: "in_review",   agent: null },
  { id: "t3",  type: "task",    title: "View-switcher slot inside Display panel (075ef2c0)",     status: "todo",        agent: null },
  { id: "t4",  type: "task",    title: "Drag-to-status handler with optimistic rollback",        status: "in_progress", agent: { name: "Senior Developer", state: "paused", line: "" } },
  { id: "t5",  type: "task",    title: "Per-tab swap for Tasks vs Insights vs Bets",             status: "todo",        agent: null },
  { id: "t6",  type: "task",    title: "Empty-column next-action prompts",                       status: "done",        agent: null },
  { id: "t7",  type: "task",    title: "Skeleton cards on board load",                           status: "done",        agent: null },
  { id: "t8",  type: "task",    title: "AgentWorkingBadge pulse-dot variant",                    status: "in_review",   agent: null },
  { id: "t9",  type: "task",    title: "Status colour tokens from app.css",                      status: "done",        agent: null },
  { id: "t10", type: "task",    title: "Card hover lift and shadow elevation",                   status: "todo",        agent: null },
  { id: "t11", type: "task",    title: "Filter persistence across List ↔ Board switch",          status: "in_progress", agent: { name: "Designer",         state: "live",   line: "drafting two directions" } },
  { id: "t12", type: "task",    title: "Rollback toast on failed drop",                          status: "todo",        agent: null },
  { id: "i1",  type: "insight", title: "Board interactions: card drag errors and choppy scroll", status: "in_progress", agent: { name: "Curator",          state: "live",   line: "linking to 3 bets" } },
  { id: "i2",  type: "insight", title: "Designers want previews they can click, not just see",   status: "in_review",   agent: null },
  { id: "i3",  type: "insight", title: "List ↔ Board filter loss confuses returning users",     status: "todo",        agent: null },
  { id: "i4",  type: "insight", title: "Active-agent indicator preferred over status timestamp", status: "done",        agent: null },
  { id: "b1",  type: "bet",     title: "Design-agent prototypes don't expose interaction bugs",  status: "in_progress", agent: null },
  { id: "b2",  type: "bet",     title: "Objects Page — Board View (Kanban)",                     status: "in_review",   agent: null }
];

/* ---------- state ---------- */
const state = {
  cards: CARDS.map(c => ({ ...c })),  // shallow clone
  metrics: { drag: 0, drop: 0, fail: 0, block: 0 }
};

const board = document.getElementById("board");
const toastHost = document.getElementById("toast-host");

if (state.cards.some(c => c.type === "bet")) {
  document.body.classList.add("has-bets");
}

/* ---------- render ---------- */
function render() {
  board.innerHTML = "";
  for (const s of STATUSES) {
    const col = document.createElement("section");
    col.className = "column";
    col.dataset.status = s.id;

    const count = state.cards.filter(c => c.status === s.id).length;
    col.innerHTML = `
      <header class="column-header">
        <span class="pill"><span class="dot"></span>${s.label}</span>
        <span class="count">${count}</span>
      </header>
      <div class="column-body" data-status="${s.id}"></div>
    `;
    board.appendChild(col);

    const body = col.querySelector(".column-body");
    for (const card of state.cards.filter(c => c.status === s.id)) {
      body.appendChild(renderCard(card));
    }
  }
  refreshMetrics();
}

function renderCard(card) {
  const el = document.createElement("article");
  el.className = "card";
  el.dataset.id = card.id;
  el.dataset.type = card.type;
  el.dataset.status = card.status;

  const lock = card.type === "bet"
    ? `<span class="lock-chip" title="Bets are gated — drag disabled">&#x1F512; Gated</span>`
    : "";

  const agent = card.agent
    ? `
      <div class="agent-indicator" title="${card.agent.state}">
        <span class="agent-dot ${card.agent.state}"></span>
        <span class="agent-name">${card.agent.name}</span>
        ${card.agent.line ? `<span class="agent-line">· ${card.agent.line}</span>` : ""}
      </div>
    `
    : `<span class="agent-line">no active session</span>`;

  el.innerHTML = `
    <div class="card-row">
      <span class="type-chip" data-type="${card.type}">${card.type}</span>
      ${lock}
    </div>
    <div class="card-title">${escapeHtml(card.title)}</div>
    <div class="card-meta">${agent}</div>
  `;
  return el;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function refreshMetrics() {
  document.getElementById("m-drag").textContent  = state.metrics.drag;
  document.getElementById("m-drop").textContent  = state.metrics.drop;
  document.getElementById("m-fail").textContent  = state.metrics.fail;
  document.getElementById("m-block").textContent = state.metrics.block;
  for (const s of STATUSES) {
    const col = board.querySelector(`.column[data-status="${s.id}"]`);
    if (!col) continue;
    const count = state.cards.filter(c => c.status === s.id).length;
    col.querySelector(".count").textContent = count;
  }
}

/* ---------- drag ---------- */
let drag = null;

board.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const cardEl = e.target.closest(".card");
  if (!cardEl) return;
  if (cardEl.dataset.type === "bet") {
    bumpMetric("block");
    flashColumn(cardEl.closest(".column"), "blocked");
    return;
  }
  e.preventDefault();

  const rect = cardEl.getBoundingClientRect();
  drag = {
    id: cardEl.dataset.id,
    fromStatus: cardEl.dataset.status,
    startX: e.clientX,
    startY: e.clientY,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    origin: { x: rect.left, y: rect.top, w: rect.width, h: rect.height },
    cardEl,
    ghost: null,
    movedPx: 0,
    pointerId: e.pointerId
  };
  cardEl.setPointerCapture(e.pointerId);
});

board.addEventListener("pointermove", (e) => {
  if (!drag) return;
  e.preventDefault();
  drag.movedPx += Math.abs(e.movementX) + Math.abs(e.movementY);

  if (!drag.ghost && drag.movedPx > 4) {
    bumpMetric("drag");
    drag.cardEl.classList.add("dragging");
    drag.ghost = document.createElement("div");
    drag.ghost.className = "ghost";
    drag.ghost.innerHTML = drag.cardEl.innerHTML;
    drag.ghost.style.width = drag.origin.w + "px";
    document.body.appendChild(drag.ghost);
  }

  if (drag.ghost) {
    drag.ghost.style.left = (e.clientX - drag.offsetX) + "px";
    drag.ghost.style.top  = (e.clientY - drag.offsetY) + "px";

    // highlight the column under the pointer
    const colEl = elementToColumn(document.elementFromPoint(e.clientX, e.clientY));
    document.querySelectorAll(".column.drop-target").forEach(c => {
      if (c !== colEl) c.classList.remove("drop-target");
    });
    if (colEl) colEl.classList.add("drop-target");
  }
});

board.addEventListener("pointerup", (e) => {
  if (!drag) return;
  finishDrag(e);
});
board.addEventListener("pointercancel", () => {
  if (!drag) return;
  cancelDrag();
});

function finishDrag(e) {
  const d = drag;
  drag = null;

  if (d.ghost) d.ghost.remove();
  d.cardEl.classList.remove("dragging");
  document.querySelectorAll(".column.drop-target").forEach(c => c.classList.remove("drop-target"));

  const dropEl = elementToColumn(document.elementFromPoint(e.clientX, e.clientY));
  if (!dropEl) {
    // dropped outside — no-op
    return;
  }
  const toStatus = dropEl.dataset.status;
  if (toStatus === d.fromStatus) return;

  // optimistic move
  const card = state.cards.find(c => c.id === d.id);
  const prevStatus = card.status;
  card.status = toStatus;
  render();

  // fake-async commit, 1-in-6 forced failure
  const shouldFail = Math.random() < (1/6);
  bumpMetric("drop");
  setTimeout(() => {
    if (!shouldFail) {
      showToast(`Moved "${truncate(card.title)}" → ${labelFor(toStatus)}`, "success");
      return;
    }
    // rollback
    card.status = prevStatus;
    bumpMetric("fail");
    render();
    showToast(`Couldn't move "${truncate(card.title)}" to ${labelFor(toStatus)}. Reverted.`, "fail");
    // snap-back hint on the rendered card
    const restored = board.querySelector(`.card[data-id="${card.id}"]`);
    if (restored) {
      restored.classList.add("snapping-back");
      restored.addEventListener("animationend", () => restored.classList.remove("snapping-back"), { once: true });
    }
  }, 350);
}

function cancelDrag() {
  const d = drag;
  drag = null;
  if (d.ghost) d.ghost.remove();
  d.cardEl.classList.remove("dragging");
  document.querySelectorAll(".column.drop-target").forEach(c => c.classList.remove("drop-target"));
}

function elementToColumn(el) {
  while (el && el !== document.body) {
    if (el.classList && el.classList.contains("column")) return el;
    el = el.parentElement;
  }
  return null;
}

function flashColumn(col, kind) {
  if (!col) return;
  col.classList.add("drop-blocked");
  setTimeout(() => col.classList.remove("drop-blocked"), 280);
}

function bumpMetric(k) {
  state.metrics[k]++;
  refreshMetrics();
  console.log(`[board] ${k}`, state.metrics);
}

function labelFor(status) {
  return STATUSES.find(s => s.id === status)?.label ?? status;
}

function truncate(s, n = 32) {
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

/* ---------- toasts ---------- */
function showToast(text, kind = "fail") {
  const t = document.createElement("div");
  t.className = "toast" + (kind === "success" ? " success" : "");
  t.textContent = text;
  toastHost.appendChild(t);
  setTimeout(() => {
    t.style.transition = "opacity 200ms ease, transform 200ms ease";
    t.style.opacity = "0";
    t.style.transform = "translateY(4px)";
    setTimeout(() => t.remove(), 220);
  }, 2400);
}

/* ---------- init ---------- */
render();
console.log("[board] ready", { cards: state.cards.length, columns: STATUSES.length });
</script>
