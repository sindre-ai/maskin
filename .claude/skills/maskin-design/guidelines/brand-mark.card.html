<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:flex;align-items:center;gap:28px">
  <img src="../assets/logo-mark.svg" alt="Maskin mark" style="width:64px;height:64px;border-radius:var(--r-xl)">
  <div style="display:flex;align-items:center;gap:.5rem;font-size:1.5rem;font-weight:700;letter-spacing:var(--ls-tight)">
    <img src="../assets/logo-mark.svg" alt="" style="width:28px;height:28px;border-radius:5px">Maskin
  </div>
  <div style="display:flex;flex-direction:column;gap:3px;margin-left:auto;text-align:right">
    <span style="font-weight:700;letter-spacing:var(--ls-tight);font-size:var(--fs-base)">Maskin</span>
    <span style="font-size:var(--fs-xs);color:var(--ink-3);font-style:italic">maskin (no.) — machine</span>
  </div>
</div>
</body>
</html>
