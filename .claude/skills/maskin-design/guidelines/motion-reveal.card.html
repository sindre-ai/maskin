<!-- @dsCard group="Motion" viewport="700x150" name="Reveal &amp; pulse" subtitle="20px rise over 550ms, staggered 80ms; live dots pulse 1.2s" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:flex;gap:10px;align-items:stretch">
  <div style="flex:1;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);padding:12px;background:var(--surface);opacity:1;transform:translateY(0px)"><div style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--d0</div><div style="font-size:var(--fs-sm);font-weight:600;margin-top:6px">Step 1</div></div>
  <div style="flex:1;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);padding:12px;background:var(--surface);opacity:0.75;transform:translateY(7px)"><div style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--d1</div><div style="font-size:var(--fs-sm);font-weight:600;margin-top:6px">Step 2</div></div>
  <div style="flex:1;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);padding:12px;background:var(--surface);opacity:0.5;transform:translateY(14px)"><div style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--d2</div><div style="font-size:var(--fs-sm);font-weight:600;margin-top:6px">Step 3</div></div>
  <div style="flex:1;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);padding:12px;background:var(--surface);opacity:0.25;transform:translateY(21px)"><div style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--d3</div><div style="font-size:var(--fs-sm);font-weight:600;margin-top:6px">Step 4</div></div>
</div>
<div style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--ink-3)">
  <i style="width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)"></i>
  <span style="font-family:var(--ff-mono);font-size:10.5px">pulse-dot 1.2s ease-in-out infinite — agent is working</span>
</div>
</body>
</html>
