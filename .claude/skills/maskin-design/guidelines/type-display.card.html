<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:var(--step-4);font-weight:700;letter-spacing:var(--ls-hero);line-height:1">Companies smarter</span><span style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3);white-space:nowrap">--step-4</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:var(--step-3);font-weight:700;letter-spacing:var(--ls-hero);line-height:1.08">Section title</span><span style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--step-3</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:var(--step-2);font-weight:700;letter-spacing:var(--ls-title)">Column title</span><span style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--step-2</span></div>
</div>
</body>
</html>
