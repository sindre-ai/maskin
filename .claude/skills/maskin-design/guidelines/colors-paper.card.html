<!-- @dsCard group="Colors" viewport="700x150" name="Paper &amp; rules" subtitle="Off-white surface, linen sunken, warm hairline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--surface);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--surface</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#FAFAF8</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--linen);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--linen</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#F0EDE7</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--rule);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--rule</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#E2DDD7</div>
  </div>
</div>
</body>
</html>
