<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:flex;flex-direction:column;gap:14px">
  <div style="font-size:0.7rem;font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:.4rem"><i style="width:16px;height:2px;background:var(--accent)"></i>HOW IT WORKS</div>
  <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">SECTION LABEL / INK-3</div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span style="font-family:var(--ff-mono);font-size:0.8rem;font-weight:500">docker-compose up</span>
    <span style="font-family:var(--ff-mono);font-size:var(--fs-sm);padding:1px 5px;border-radius:var(--r-xs);background:var(--linen)">get_started</span>
    <span style="font-family:var(--ff-mono);font-size:0.63rem;color:var(--ink-3);letter-spacing:.04em">agent · analyst · running</span>
  </div>
</div>
</body>
</html>
