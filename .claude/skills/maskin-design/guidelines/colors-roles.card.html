<!-- @dsCard group="Colors" viewport="700x120" name="Role accents" subtitle="3px card top-borders per agent team" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
  <div style="border:var(--bw) solid var(--rule);border-top:var(--bw-top) solid var(--role-product);border-radius:var(--r-lg);padding:10px 8px;background:var(--surface)">
    <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">product</div>
  </div>
  <div style="border:var(--bw) solid var(--rule);border-top:var(--bw-top) solid var(--role-growth);border-radius:var(--r-lg);padding:10px 8px;background:var(--surface)">
    <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">growth</div>
  </div>
  <div style="border:var(--bw) solid var(--rule);border-top:var(--bw-top) solid var(--role-sales);border-radius:var(--r-lg);padding:10px 8px;background:var(--surface)">
    <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">sales</div>
  </div>
  <div style="border:var(--bw) solid var(--rule);border-top:var(--bw-top) solid var(--role-cs);border-radius:var(--r-lg);padding:10px 8px;background:var(--surface)">
    <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">cs</div>
  </div>
  <div style="border:var(--bw) solid var(--rule);border-top:var(--bw-top) solid var(--role-intel);border-radius:var(--r-lg);padding:10px 8px;background:var(--surface)">
    <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">intel</div>
  </div>
  <div style="border:var(--bw) solid var(--rule);border-top:var(--bw-top) solid var(--role-eng);border-radius:var(--r-lg);padding:10px 8px;background:var(--surface)">
    <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">eng</div>
  </div>
  <div style="border:var(--bw) solid var(--rule);border-top:var(--bw-top) solid var(--role-ops);border-radius:var(--r-lg);padding:10px 8px;background:var(--surface)">
    <div style="font-size:var(--fs-label);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)">ops</div>
  </div>
</div>
</body>
</html>
