<!-- @dsCard group="Spacing" viewport="700x170" name="Section rhythm" subtitle="--section-py block, --gap inline, 1280px container" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="border:var(--bw-hair) dashed var(--rule);border-radius:var(--r-lg);overflow:hidden">
  <div style="height:22px;background:var(--accent-dim)"></div>
  <div style="padding:0 var(--gap)">
    <div style="height:60px;background:var(--linen);border-left:var(--bw-hair) dashed var(--rule);border-right:var(--bw-hair) dashed var(--rule);display:grid;place-items:center;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">content · max-width 1280px</div>
  </div>
  <div style="height:22px;background:var(--accent-dim)"></div>
</div>
<div style="margin-top:10px;display:flex;gap:18px;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)"><span>--section-py clamp(4rem,9vw,8rem)</span><span>--gap clamp(1rem,3vw,2.5rem)</span></div>
</body>
</html>
