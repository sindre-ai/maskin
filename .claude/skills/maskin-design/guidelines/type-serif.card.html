<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="background:var(--ink);border-radius:var(--r-lg);padding:22px 24px">
  <div style="position:relative;padding-left:2rem;font-family:var(--ff-serif);font-style:italic;font-weight:400;font-size:34px;line-height:1.18;letter-spacing:var(--ls-tight);color:var(--surface)">
    <span style="position:absolute;left:0;top:.12em;width:3px;height:calc(100% - .24em);background:var(--accent);border-radius:2px"></span>
    A chat history is not a team memory.
  </div>
</div>
</body>
</html>
