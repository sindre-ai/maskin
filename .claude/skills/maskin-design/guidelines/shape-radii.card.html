<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="4 / 5 / 6 / 8 / 10 / 12 / 14 / 20 / pill — all present in the source" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:flex;gap:10px;align-items:flex-end">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:58px;height:46px;border:var(--bw) solid var(--rule);border-radius:4px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-xs<br>4px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:58px;height:46px;border:var(--bw) solid var(--rule);border-radius:5px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-tag<br>5px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:58px;height:46px;border:var(--bw) solid var(--rule);border-radius:6px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-sm<br>6px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:58px;height:46px;border:var(--bw) solid var(--rule);border-radius:8px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-md<br>8px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:58px;height:46px;border:var(--bw) solid var(--rule);border-radius:10px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-banner<br>10px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:58px;height:46px;border:var(--bw) solid var(--rule);border-radius:12px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-lg<br>12px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:58px;height:46px;border:var(--bw) solid var(--rule);border-radius:14px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-xl<br>14px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:72px;height:30px;border:var(--bw) solid var(--rule);border-radius:20px;background:var(--surface)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-chip<br>20px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:72px;height:30px;border:var(--bw) solid var(--rule);border-radius:var(--r-pill);background:var(--linen)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap">--r-pill<br>999px</span></div>
</div>
</body>
</html>
