<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="One blue. Eyebrows, links, active state — never large fills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--accent);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--accent</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#2563EB</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--accent-dim);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--accent-dim</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">rgba(37,99,235,.12)</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:radial-gradient(ellipse 70% 70% at 60% 40%,var(--accent-glow) 0%,transparent 70%);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--accent-glow</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">hero wash, .09</div>
  </div>
</div>
</body>
</html>
