<!-- @dsCard group="Colors" viewport="700x150" name="Ink ramp" subtitle="Warm near-black foreground, three steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--ink);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--ink</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#111110</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--ink-2);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--ink-2</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#5A5751</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--ink-3);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--ink-3</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#9B958F</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="height:56px;border-radius:var(--r-md);background:var(--ink-hover);border:var(--bw-hair) solid var(--rule)"></div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2)">--ink-hover</div>
    <div style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">#2a2925</div>
  </div>
</div>
</body>
</html>
