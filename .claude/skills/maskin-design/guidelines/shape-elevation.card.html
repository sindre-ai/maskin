<!-- @dsCard group="Spacing" viewport="700x160" name="Borders &amp; elevation" subtitle="1.5px is the signature weight; shadows stay warm and faint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-xs)"></div><span style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--shadow-xs</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm)"></div><span style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--shadow-sm</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-md)"></div><span style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--shadow-md</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:var(--bw) solid var(--rule);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-lg)"></div><span style="font-family:var(--ff-mono);font-size:10px;color:var(--ink-3)">--shadow-lg</span></div>
</div>
<div style="margin-top:12px;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">--bw 1.5px solid var(--rule) · hover → border-color var(--ink-2)</div>
</body>
</html>
