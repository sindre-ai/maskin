<!-- @dsCard group="Spacing" viewport="700x140" name="Static scale" subtitle="The rem steps used verbatim in components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:flex;align-items:flex-end;gap:10px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:4px;height:4px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">05</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:6px;height:6px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">1</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:8px;height:8px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">2</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:12px;height:12px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">3</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:16px;height:16px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:20px;height:20px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">5</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:24px;height:24px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">6</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:28px;height:28px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">7</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:36px;height:36px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">8</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:48px;height:48px;background:var(--linen);border:var(--bw-hair) solid var(--rule);border-radius:var(--r-xs)"></div><span style="font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3)">9</span></div>
</div>
</body>
</html>
