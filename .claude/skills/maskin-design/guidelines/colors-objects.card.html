<!-- @dsCard group="Colors" viewport="700x130" name="Object types" subtitle="Insight → Bet → Task → Knowledge, as mono tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
  <span style="font-family:var(--ff-mono);font-size:var(--fs-label);font-weight:500;padding:.2rem .5rem;border-radius:var(--r-tag);color:var(--obj-insight);background:var(--obj-insight-bg)">insight</span>
  <span style="color:var(--ink-3)">→</span>
  <span style="font-family:var(--ff-mono);font-size:var(--fs-label);font-weight:500;padding:.2rem .5rem;border-radius:var(--r-tag);color:var(--obj-bet);background:var(--obj-bet-bg)">bet</span>
  <span style="color:var(--ink-3)">→</span>
  <span style="font-family:var(--ff-mono);font-size:var(--fs-label);font-weight:500;padding:.2rem .5rem;border-radius:var(--r-tag);color:var(--obj-task);background:var(--obj-task-bg)">task</span>
  <span style="color:var(--ink-3)">→</span>
  <span style="font-family:var(--ff-mono);font-size:var(--fs-label);font-weight:500;padding:.2rem .5rem;border-radius:var(--r-tag);color:var(--obj-knowledge);background:var(--obj-knowledge-bg)">knowledge</span>
</div>
<div style="display:flex;gap:18px;margin-top:16px">
  <span style="display:flex;align-items:center;gap:6px;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)"><i style="width:8px;height:8px;border-radius:50%;background:var(--obj-insight)"></i>#5B8DD9</span>
  <span style="display:flex;align-items:center;gap:6px;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)"><i style="width:8px;height:8px;border-radius:50%;background:var(--obj-bet)"></i>#E67E22</span>
  <span style="display:flex;align-items:center;gap:6px;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)"><i style="width:8px;height:8px;border-radius:50%;background:var(--obj-task)"></i>#27AE60</span>
  <span style="display:flex;align-items:center;gap:6px;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)"><i style="width:8px;height:8px;border-radius:50%;background:var(--obj-knowledge)"></i>#7C3AED</span>
</div>
</body>
</html>
