<!-- @dsCard group="Brand" viewport="700x150" name="Surface pairings" subtitle="Paper, linen band, and the inverted ink section" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--ff-display);font-size:13px">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:var(--bw-hair) solid var(--rule);border-radius:var(--r-lg);overflow:hidden;height:104px">
  <div style="background:var(--surface);display:grid;place-items:center;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3)">--surface</div>
  <div style="background:var(--linen);display:grid;place-items:center;font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-2);border-left:var(--bw-hair) solid var(--rule);border-right:var(--bw-hair) solid var(--rule)">--linen</div>
  <div style="background:var(--ink);display:grid;place-items:center;font-family:var(--ff-mono);font-size:10.5px;color:rgba(250,250,248,.6)">--ink (inverted)</div>
</div>
</body>
</html>
