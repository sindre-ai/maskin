name: App Store release version

# Manual only. Releases one App Store version of the iPhone app that Apple has approved and that
# is waiting for a click on Release (state Pending Developer Release), then reads the state back.
# It refuses any other state, and never submits, attaches a build or changes the release type
# (.github/scripts/asc-release-version.mjs). A release cannot be undone once the version is live:
# the run summary shows the version and its state before the script acts.
#
# Uses the same App Store Connect secrets as ios-testflight.yml (ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8). A Linux job: it only talks to the App Store Connect API.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved App Store version to release, for example 1.2'
        type: string
        required: true

# Not the ios-testflight group on purpose: this must not queue behind a macOS upload.
concurrency:
  group: asc-release-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::App Store Connect secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) are not set."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Write the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Release the version
        env:
          SUBMIT_VERSION: ${{ inputs.version }}
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-release-version.mjs

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
