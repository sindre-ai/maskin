name: CI

on:
  push:
    branches:
      - main
      - 'bet/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: lint-typecheck

      - run: pnpm lint
      - run: pnpm type-check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: unit-tests

      - run: pnpm test -- -- --run

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maskin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: integration-tests

      - run: pnpm build

      # Boots the actual bundled artifact (apps/dev/dist/index.js) that ships to
      # production — not `tsx src/index.ts` like the dev server or e2e webServer
      # use. Catches bugs that only exist in the flattened esbuild bundle, e.g. a
      # module reading a file relative to its own compiled path (which points
      # into dist/ once bundled, not next to a checked-in data/ folder anymore).
      - name: Smoke test — boot the built server
        run: |
          set -e
          pnpm db:migrate
          node apps/dev/dist/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server booted and responded to /api/health"
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited before responding to /api/health — see logs above"
              exit 1
            fi
            sleep 1
          done
          echo "Server did not respond to /api/health within 30s"
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_test
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef

      - run: pnpm test:integration -- --run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_test
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef

  verify-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maskin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: verify-e2e

      - run: pnpm build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maskin/e2e exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maskin/e2e exec playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/5)
        run: pnpm --filter @maskin/e2e exec playwright test --shard=${{ matrix.shard }}/5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/e2e/playwright-report/
          retention-days: 7

  verify-e2e-favourites:
    # Focused signal for the object-favourites bet: runs only the two star
    # specs (object-card-star-toggle + objects-starred-filter). The umbrella
    # PR needs a green run covering AC 1–5 before merging to main; a dedicated
    # job produces that signal on every push to a bet/** branch, isolated
    # from unrelated flakes in the full verify-e2e matrix. AC 6–8 (PostHog
    # events) remain gated on Task 1 OAuth and are not asserted here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maskin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: verify-e2e-favourites

      - run: pnpm build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maskin/e2e exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maskin/e2e exec playwright install-deps chromium

      - name: Run star toggle + starred filter specs
        run: pnpm --filter @maskin/e2e exec playwright test object-card-star-toggle.spec.ts objects-starred-filter.spec.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-favourites
          path: apps/e2e/playwright-report/
          retention-days: 7
