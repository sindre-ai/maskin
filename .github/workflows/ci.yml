name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THROWAWAY NARROWED RUN. Not for merge. Same steps as verify-e2e in the real
  # ci.yml, minus sharding, with the Playwright invocation restricted to the two
  # invite specs and an explicit per-spec assertion.
  #
  # Why the extra assertion: the real step ends in `|| true` and then
  # assert-results.mjs, which exits 0 when expected=0 and unexpected=0. A filter
  # that matches nothing would therefore go green. The check below fails unless
  # both spec files appear in the JSON report with every test passed.
  verify-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maskin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Start SeaweedFS (S3-compatible backend)
        run: |
          set -euo pipefail
          docker run -d --name seaweedfs \
            -p 8333:8333 -p 9333:9333 \
            -v "$PWD/seaweedfs-s3.json":/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || echo 000)
            if [ "$status" != "000" ]; then break; fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" \
              --user "admin:admin" \
              -X PUT http://localhost:8333/agent-files; then
              echo "SeaweedFS ready; bucket agent-files created."
              exit 0
            fi
            sleep 1
          done
          echo "::error::SeaweedFS never accepted the agent-files bucket PUT after 30s."
          docker logs seaweedfs || true
          exit 1

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: verify-e2e

      - run: pnpm build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maskin/e2e exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maskin/e2e exec playwright install-deps chromium

      - name: Run the two invite E2E specs only
        run: |
          pnpm --filter @maskin/e2e exec playwright test invite-email-new-user invite-email-existing-user || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          MASKIN_TEST_GRANT_TOKEN: e2e-local-test-grant-token
          AGENT_SERVER_SECRET: e2e-agent-server-secret
          ARGOS_ENABLED: 'false'
          NODE_OPTIONS: --unhandled-rejections=warn
          S3_ENDPOINT: http://localhost:8333
          S3_BUCKET: agent-files
          S3_ACCESS_KEY: admin
          S3_SECRET_KEY: admin
          S3_REGION: us-east-1

      - name: Assert both invite specs ran and every test passed
        run: |
          node apps/e2e/scripts/assert-results.mjs apps/e2e/playwright-report/e2e-results.json
          node - <<'EOF'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('apps/e2e/playwright-report/e2e-results.json', 'utf8'))
          const specs = []
          const walk = (suite) => {
            for (const s of suite.specs ?? []) specs.push(s)
            for (const child of suite.suites ?? []) walk(child)
          }
          for (const suite of report.suites ?? []) walk(suite)
          let failed = false
          for (const name of ['invite-email-new-user', 'invite-email-existing-user']) {
            const mine = specs.filter((s) => (s.file ?? '').includes(name))
            const passed = mine.filter((s) => s.tests.every((t) => t.status === 'expected'))
            console.log(`[invite-proof] ${name}: ${mine.length} test(s) ran, ${passed.length} passed`)
            for (const s of mine) console.log(`[invite-proof]   ${s.ok ? 'PASS' : 'FAIL'} ${s.file} :: ${s.title}`)
            if (mine.length === 0 || passed.length !== mine.length) failed = true
          }
          if (failed) {
            console.error('[invite-proof] FAILED: a spec did not run or did not pass')
            process.exit(1)
          }
          console.log('[invite-proof] OK: both invite specs ran and every test passed')
          EOF

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-invite
          path: apps/e2e/playwright-report/
          retention-days: 7
