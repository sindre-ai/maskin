name: CI

on:
  push:
    branches: [main]
  # bet/** so task PRs into a bet branch get the same checks as a PR into main.
  # Without it they report nothing until the aggregate bet -> main PR.
  pull_request:
    branches: [main, 'bet/**']
  # GitHub merge queue: runs the required checks on a temporary branch holding
  # main plus the queued PRs. Without this trigger the checks never report on
  # that branch and every queued PR times out. The `changes` job only diffs on
  # pull_request, so a queue run falls through to "run everything".
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the slow jobs a change can affect (scripts/ci/changed-areas.sh).
  # Lint, type-check and unit tests always run: they are cheap and cover every package.
  # Integration tests and e2e are skipped only when every changed file is one the script
  # lists as unable to affect them (docs, the Apple app, other apps' workflows, ...);
  # anything unknown, a push to main, a merge_group run, or a diff that cannot be computed
  # runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      e2e: ${{ steps.areas.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Self-test the path rules
        run: bash scripts/ci/changed-areas.test.sh

      - name: Which areas changed?
        id: areas
        run: |
          : > changed.txt
          # Only a pull_request has a base_ref (it is empty on merge_group). push and
          # merge_group leave the list empty on purpose, which runs every area.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt || : > changed.txt
          fi
          bash scripts/ci/changed-areas.sh < changed.txt | tee -a "$GITHUB_OUTPUT"

  # Config-only gate. The Alloy configs and Grafana alert rules under
  # observability/ are shipped as text and applied by hand — nothing in the
  # build or the test suite ever parses them, so without this job their first
  # syntax check is a human pasting them onto a production box.
  #
  # It is deliberately cheap and has no dependency on the pnpm workspace, so it
  # gives a signal in well under a minute rather than waiting on a full install.
  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `alloy validate` catches syntax and component-graph errors — an
      # undefined component reference, a bad argument name, a forward_to
      # pointing at something that does not exist. Run in the same container
      # image the hosts run, so a version-specific rejection surfaces here.
      #
      # NOTE WHAT IT CANNOT CATCH, because this is the recurring trap in this
      # directory: a config that validates cleanly and still matches nothing.
      # Discovery returning zero targets, a `job` label set upstream of the
      # component that overwrites it, an allowlist regex that excludes every
      # real container — all of these are "valid". See
      # .claude/rules/known-pitfalls.md, "A Healthy Collector Component That
      # Silently Matches Nothing". This job is a floor, not a proof.
      - name: alloy validate
        env:
          ALLOY_IMAGE: grafana/alloy:v1.19.0
        run: |
          set -euo pipefail
          for cfg in apps/agent-server/observability/alloy.alloy observability/coolify-host/alloy.alloy; do
            echo "==> $cfg"
            docker run --rm -v "$PWD:/w" -w /w "$ALLOY_IMAGE" validate "$cfg"
          done

      - name: Install promtool
        env:
          PROMETHEUS_VERSION: 2.55.1
        run: |
          set -euo pipefail
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${tarball}.tar.gz"
          curl -sSfL "$url" | sudo tar xz --strip-components=1 -C /usr/local/bin "${tarball}/promtool"
          promtool --version

      # Validates the Grafana alert rules: PromQL syntax via promtool, plus the
      # structural invariants promtool cannot see because these are unified
      # alerting files rather than Prometheus rule files. See the script header.
      - name: Validate alert rules
        run: |
          pip install --quiet pyyaml
          python observability/validate-alerts.py

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: lint-typecheck

      - run: pnpm lint
      - run: pnpm type-check

  unit-tests:
    # Waits for lint so a lint or formatting failure ends the run in about a minute
    # instead of letting the slow jobs run to the end. See the note on integration-tests.
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: unit-tests

      - run: pnpm test -- -- --run

  integration-tests:
    # lint-typecheck is a gate here and on unit-tests and verify-e2e: when it fails they are
    # skipped, so a red lint run reports in about a minute instead of 16 to 22. Their required
    # checks then read as skipped (verify-e2e as one skipped job, not seven), never as passed
    # by a test run; lint-typecheck is itself required and red, so the PR stays blocked.
    needs: [changes, lint-typecheck]
    # A skipped job counts as passing for the required check of the same name.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # actions/cache waits 10 minutes per segment by default; when the cache
      # backend is unavailable (e.g. "Egress is over the account limit") the
      # setup-node pnpm cache restore alone burned half of this job's budget.
      # A cache miss only costs a cold install, so fail fast instead.
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
    steps:
      # A throwaway database: durability buys nothing here, and each test file
      # clones its own database from a template, so run it on tmpfs with fsync
      # off and enough connections for parallel workers. (A `services:` block
      # cannot pass server flags, hence docker run.)
      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5432:5432 --tmpfs /var/lib/postgresql/data -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=maskin_test postgres:16-alpine -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build outputs
        uses: ./.github/actions/cache-turbo
        with:
          job-name: integration-tests

      - run: pnpm build

      # Boots the actual bundled artifact (apps/dev/dist/index.js) that ships to
      # production — not `tsx src/index.ts` like the dev server or e2e webServer
      # use. Catches bugs that only exist in the flattened esbuild bundle, e.g. a
      # module reading a file relative to its own compiled path (which points
      # into dist/ once bundled, not next to a checked-in data/ folder anymore).
      - name: Smoke test — boot the built server
        run: |
          set -e
          pnpm db:migrate
          node apps/dev/dist/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server booted and responded to /api/health"
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited before responding to /api/health — see logs above"
              exit 1
            fi
            sleep 1
          done
          echo "Server did not respond to /api/health within 30s"
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_test
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef

      - name: Wait for Postgres
        run: until docker exec pg pg_isready -U postgres; do sleep 1; done

      # Calls the package script directly: `pnpm test:integration` goes through
      # turbo, which re-runs the ^build tasks the `pnpm build` step just did.
      - run: pnpm --filter @maskin/dev test:integration -- --run
        env:
          INTEGRATION_WORKERS: 4
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_test
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef

  # Guards for scripts/bootstrap-local-devstack.sh, the no-Docker dev stack.
  # Nothing else runs that script, so a change that breaks a fresh bootstrap is
  # otherwise first noticed by the next agent whose session needs a database.
  # Each check lives in scripts/checks/ and bootstraps into a throwaway dir.
  dev-bootstrap-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The cache is what keeps this job off snapshot.debian.org, which is the
      # flake risk here rather than the check itself. Keyed on the two pinned
      # versions the script downloads; only the downloads are cached, never a
      # data dir.
      - name: Read devstack versions
        id: devstack
        run: |
          echo "pg=$(sed -n 's/^MASKIN_PG_VERSION="${MASKIN_PG_VERSION:-\(.*\)}"$/\1/p' scripts/bootstrap-local-devstack.sh)" >> "$GITHUB_OUTPUT"
          echo "weed=$(sed -n 's/^MASKIN_WEED_VERSION="${MASKIN_WEED_VERSION:-\(.*\)}"$/\1/p' scripts/bootstrap-local-devstack.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache devstack downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/maskin-devstack/postgres-*
            ~/.cache/maskin-devstack/vendor-lib-*
            ~/.cache/maskin-devstack/weed-*
          key: devstack-${{ runner.os }}-${{ runner.arch }}-pg${{ steps.devstack.outputs.pg }}-weed${{ steps.devstack.outputs.weed }}

      - name: Fresh bootstrap is UTF8 and migrates
        run: bash scripts/checks/fresh-db-utf8.sh

      - name: A busy SeaweedFS master port is routed around
        run: MASKIN_DEVSTACK_CACHE_DIR="$HOME/.cache/maskin-devstack" bash scripts/checks/devstack-port-conflict.sh

  # Boots the real agent-base image through its entrypoint and agent-run.sh with
  # a stub `claude` (scripts/checks/agent-image-smoke.sh). Merging a change under
  # docker/agent-base/ publishes the image and restarts the shared agent-server
  # (agent-base-docker.yml), and nothing else runs agent-run.sh before that, so a
  # script that aborts under `set -e` otherwise takes down every session at once.
  # The image build is skipped on PRs that don't touch its inputs; the job still
  # reports success so it can be a required check.
  agent-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Did the agent image inputs change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] &&
            git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- \
              docker/agent-base scripts/checks/agent-image-smoke.sh scripts/checks/fixtures; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.run == 'true'

      # Reads the layer cache agent-base-docker.yml writes on main; never writes.
      - name: Build agent-base image
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/agent-base
          load: true
          tags: maskin-agent-base:smoke
          cache-from: type=gha

      - name: Sessions reach the agent launch
        if: steps.changed.outputs.run == 'true'
        run: AGENT_IMAGE=maskin-agent-base:smoke bash scripts/checks/agent-image-smoke.sh

  verify-e2e:
    needs: [changes, lint-typecheck]
    # Not a job-level `if`: the ruleset requires the checks `verify-e2e (1)`..`(5)` by name, and a
    # skipped matrix job would never create them. So every shard starts and reports success, and
    # each step below does its work only when the e2e area changed.
    runs-on: ubuntu-24.04
    # Pinned: ubuntu-latest moved to 26.04, which Playwright cannot install chromium on
    # ("does not support chromium on ubuntu26.04-x64"). Unpin once Playwright supports it.
    # A healthy shard finishes in ~6 minutes. Without a cap, one wedged shard
    # (a spec waiting on something that can never happen — see the SSE /
    # networkidle note in the a11y specs) runs to GitHub's 6-hour default and
    # holds the PR open with no signal.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maskin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.e2e == 'true'

      # SeaweedFS is the S3-compatible backend the dev server writes skill
      # content to. The install path (POST /api/installed-loops) puts one S3
      # object per provisioned skill inside the install transaction — with no
      # backend reachable, every marketplace bundle install fails the whole
      # transaction with ECONNREFUSED and returns a generic 500 (root-caused
      # 2026-08-13). Started as a step (not `services:`) so it can mount
      # `seaweedfs-s3.json`; same image + credentials + bucket name as
      # docker-compose.yml so behaviour matches local dev.
      - name: Start SeaweedFS (S3-compatible backend)
        if: needs.changes.outputs.e2e == 'true'
        run: |
          set -euo pipefail
          docker run -d --name seaweedfs \
            -p 8333:8333 -p 9333:9333 \
            -v "$PWD/seaweedfs-s3.json":/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          # Poll until the S3 port responds with any HTTP status. Not `curl -f`:
          # an unauthenticated GET returns 403, which still means "port open,
          # server up." Only status=000 (connection refused) means "not ready."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || echo 000)
            if [ "$status" != "000" ]; then break; fi
            sleep 1
          done
          # The port opens before the S3 filer can actually serve a bucket PUT,
          # so an open port is necessary but not sufficient — retry the PUT
          # itself rather than assuming readiness. Without this a single early
          # non-2xx fails the whole shard under `set -e`, with no diagnostics.
          for i in $(seq 1 30); do
            if curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" \
              --user "admin:admin" \
              -X PUT http://localhost:8333/agent-files; then
              echo "SeaweedFS ready; bucket agent-files created."
              exit 0
            fi
            sleep 1
          done
          echo "::error::SeaweedFS never accepted the agent-files bucket PUT after 30s."
          docker logs seaweedfs || true
          exit 1

      - uses: pnpm/action-setup@v5
        if: needs.changes.outputs.e2e == 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.e2e == 'true'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.e2e == 'true'

      - name: Cache turbo build outputs
        if: needs.changes.outputs.e2e == 'true'
        uses: ./.github/actions/cache-turbo
        with:
          job-name: verify-e2e

      - run: pnpm build
        if: needs.changes.outputs.e2e == 'true'

      - name: Run database migrations
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e

      - name: Cache Playwright browsers
        if: needs.changes.outputs.e2e == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `playwright install-deps` apt-installs ~24 MB (mostly fonts) on every shard. Some runners
      # are throttled to ~40 kB/s on azure.archive.ubuntu.com, which turned that into a 10 minute
      # download and pushed shards past the job timeout. Cache the downloaded .debs so a shard
      # only fetches what is missing. Fonts stay installed, so screenshot baselines are unchanged.
      - name: Cache Playwright apt packages
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/playwright-apt
            !~/.cache/playwright-apt/lock
            !~/.cache/playwright-apt/partial
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-apt-${{ runner.os }}-

      - name: Point apt at the cached package directory
        if: needs.changes.outputs.e2e == 'true'
        run: |
          mkdir -p "$HOME/.cache/playwright-apt/partial"
          {
            echo "Dir::Cache::archives \"$HOME/.cache/playwright-apt\";"
            # Keep downloaded .debs so the cache has something to save.
            echo 'APT::Keep-Downloaded-Packages "true";'
          } | sudo tee /etc/apt/apt.conf.d/99playwright-cache

      - name: Install Playwright browsers
        if: needs.changes.outputs.e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maskin/e2e exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: needs.changes.outputs.e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maskin/e2e exec playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/7)
        if: needs.changes.outputs.e2e == 'true'
        # Argos's upload() can reject via a promise that safe-argos-reporter.ts's
        # own try/catch doesn't end up wrapping — an unhandled rejection there
        # has previously crashed an otherwise-green shard. Rather than keep
        # patching that from the reporter side, don't let this step's exit
        # code decide pass/fail at all: `|| true` lets a non-zero exit through,
        # and assert-results.mjs makes the real call from Playwright's own
        # JSON report, which is written to disk before Argos's reporter ever
        # runs (see playwright.config.ts). A problem anywhere in Argos's
        # upload path — quota, outage, auth, a library bug — can then never
        # fail the job, while an actual test regression still does.
        run: |
          # Plain assignment, so a failure in the splitter stops the step. Inside the
          # playwright command it would expand to nothing and run every spec in every shard.
          specs=$(cd apps/e2e && node scripts/shard-specs.mjs ${{ matrix.shard }} 7)
          pnpm --filter @maskin/e2e exec playwright test $specs || true
          node apps/e2e/scripts/assert-results.mjs apps/e2e/playwright-report/e2e-results.json
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maskin_e2e
          INTEGRATION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          # Mounts POST /api/test-grants so specs can obtain a paid tier / the
          # BYO-LLM entitlement, neither of which is self-service in the product.
          # Playwright spawns the API itself (webServer in playwright.config.ts),
          # so this one entry reaches both the specs and the stack under test.
          # Never set in production — the route is not mounted without it.
          MASKIN_TEST_GRANT_TOKEN: e2e-local-test-grant-token
          # Bearer for the internal agent-server log-ingest endpoint
          # (POST /api/internal/agent-servers/sessions/:id/logs), which the
          # live-update spec posts to in order to drive the real SSE log
          # stream. The route 503s when unset, so without this the spec fails
          # at the first ingest call. Mirrors MASKIN_TEST_GRANT_TOKEN: the
          # value is fixed and test-only, and reaches the stack because
          # Playwright spawns the API itself.
          AGENT_SERVER_SECRET: e2e-agent-server-secret
          # Argos visual-regression uploads are opt-in and never gate a PR: the
          # free-plan screenshot quota is shared across all shards of all runs,
          # so an exhausted quota fails the upload for reasons unrelated to the
          # code under test. Only pushes to `main` capture and upload; on PRs
          # `isArgosEnabled()` is false, so the reporter is not registered and
          # `safeArgosScreenshot()` is a no-op.
          ARGOS_ENABLED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          # `warn` is a Node-level backstop for the enabled (main) path: Argos's
          # upload() can reject via a promise that safe-argos-reporter.ts's own
          # try/catch doesn't end up wrapping (see that file's comment), and
          # `warn` stops that unhandled rejection from crashing the process
          # before assert-results.mjs gets to run.
          NODE_OPTIONS: --unhandled-rejections=warn
          S3_ENDPOINT: http://localhost:8333
          S3_BUCKET: agent-files
          S3_ACCESS_KEY: admin
          S3_SECRET_KEY: admin
          S3_REGION: us-east-1

      - name: Upload Playwright report
        if: always() && needs.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/e2e/playwright-report/
          retention-days: 7
