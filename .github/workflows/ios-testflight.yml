name: iOS TestFlight

# Signed iOS archive uploaded to TestFlight on every merge to main that changes MARKETING_VERSION in
# apps/apple/project.yml. apple.yml stays the unsigned compile check; this workflow is the release path.
#
# Why only a version change: Apple closes the build train of a version once it is released and refuses
# every further build with that version number ("Invalid Pre-Release Train", error 90186, and error
# 90062). A merge that leaves MARKETING_VERSION alone would spend a Mac for an hour and then fail, and
# keep main red. The plan job compares the version with the commit before the push, and the Mac job
# only starts when it changed. A failed upload is retried by running the failed job again from Actions.
#
# Inert until the four secrets below exist: the first step checks for them and every later
# step is skipped, so merging this file before the Apple setup is done does not turn main red.
#
#   APPLE_TEAM_ID          10-character Apple Developer Team ID
#   ASC_KEY_ID             App Store Connect API key id
#   ASC_ISSUER_ID          App Store Connect issuer id
#   ASC_KEY_P8             contents of the AuthKey_XXXX.p8 file (key role: Admin, so Xcode can
#                          create and manage the distribution certificate and profiles)
#
# Signing is automatic and cloud managed: xcodebuild -allowProvisioningUpdates with the API
# key creates the distribution certificate and App Store profiles for io.maskin.app and its
# extensions, so no certificate or profile files live in the repo or in secrets.
#
# Every run starts on a fresh Mac, and automatic signing mints a new development certificate
# on it. Apple caps the certificates per account, so a step at the end of the job revokes the
# development certificates this run created (.github/scripts/asc-dev-certs.mjs). Distribution
# certificates and profiles are never touched.
#
# Build number is a UTC timestamp (yymmddHHMM), always higher than the last upload. The
# marketing version still comes from project.yml.
#
# The debug symbols (dSYMs) of each build are kept as a workflow artifact for 7 days, named
# Maskin-dSYMs-<build number>. Apple's copy cannot be downloaded for a build without bitcode,
# so this is the only way to symbolicate a crash log from a CI build. Each artifact is about
# 400 MB, which is why retention is 7 days and not 14.
#
# Crash and error reports: the build carries the DSN of the native app's Sentry project (maskin-ios), see
# MASKIN_SENTRY_DSN below, so a TestFlight build reports crashes and nothing else does. The dSYMs are also
# uploaded to that project so crashes show real function names. The upload needs one repository secret,
# SENTRY_AUTH_TOKEN_IOS (an organization token with release and project read-write rights). Unset = the
# upload step is skipped and the build goes on; the 7 day artifact above stays the fallback.
#
# Internal testers get the build automatically once App Store Connect finishes processing it,
# if the internal TestFlight group has "Automatic distribution" switched on.
#
# Apple TV: the TV app (io.maskin.app, the same bundle id as iPhone, Top Shelf io.maskin.app.topshelf)
# is the tvOS platform of the one Maskin App Store record, so the iOS archive never contains it. Job
# testflight-tv archives the MaskinTV scheme for tvOS and uploads it after the iPhone upload, with the
# same build number, secrets and certificate clean-up. It runs after the iPhone job (not beside it) so
# the two never revoke each other's development certificates, and it is a separate job so a failed TV
# upload never blocks the iPhone App Review submission and can be re-run alone from Actions. Needs the
# tvOS platform added to the Maskin app record in App Store Connect; without it the upload is
# rejected. TV is not sent to App Review (app-review below
# stays iPhone only). dSYMs are kept as Maskin-TV-dSYMs-<build number>.
#
# The TV job is off until the repository variable APPLE_TV_UPLOAD is set to true (Settings, Secrets
# and variables, Actions, Variables). Infra & DevOps sets it once the tvOS platform exists on the Maskin app
# record in App Store Connect, so a version bump before that does not turn main red or spend a second Mac run.
#
# App Review: a merge that changes MARKETING_VERSION in apps/apple/project.yml also sends that
# version to App Review, once the upload is processed (job app-review, .github/scripts/
# asc-submit-review.mjs). The what's-new text comes from
# apps/apple/release-notes.md ("# <version>" on the first line). The release type is automatic: the
# version goes live as soon as Apple approves it, with no one pressing Release.
#
# Daily retry: a schedule (07:23 UTC, weekends too) runs the app-review job alone for the
# MARKETING_VERSION on main, as a real submit and not a dry run. A submit that failed once, or a
# version whose upload finished after the push, is then sent without anyone starting a run. It is
# safe every day: the script stops with "Nothing to do" for a version that is sent, in review or
# live, and ends quietly when App Store Connect has no build of that version yet.
#
# Started by hand (Actions, Run workflow) the workflow does not archive. It reads App Store Connect:
# "dry run" prints what a submission would do and creates nothing; "submit_version" submits that
# version (it also retries a submission that failed, because a later merge with the same version
# never counts as a change). The submit job is separate from the upload job, so a failed
# submission leaves the TestFlight build in place.
#
# One macOS runner for roughly 20-30 minutes per merge that changes MARKETING_VERSION (10x the
# per-minute cost of Linux), and a second one for the Apple TV upload. Other merges only run the
# short Linux plan job.

on:
  push:
    branches: [main]
    paths:
      - 'apps/apple/**'
      - '!apps/apple/docs/**'
      - '!apps/apple/Tests/**'
      - '!apps/apple/**/*.md'
      - '.github/workflows/ios-testflight.yml'
  # Retry of the App Review submit, see the header. Cron runs in UTC and only on the default branch.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read App Store Connect and print what would happen, create nothing'
        type: boolean
        default: true
      submit_version:
        description: 'Version to send to App Review, for example 1.2 (empty = the version in project.yml, dry run only)'
        type: string
        default: ''
      tv_signing_check:
        description: 'Apple TV signing check: archive and export MaskinTV signed for distribution, upload nothing, print the entitlements'
        type: boolean
        default: false

# Never cancel an upload half way; queue back-to-back merges instead.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # Decides whether this push uploads. A Linux job on purpose: for a push that leaves the version
  # alone nothing starts on a Mac. It uploads when MARKETING_VERSION differs from the commit before
  # the push. With no previous commit to compare against (first push, force push that dropped it) it
  # uploads as before, so a real version bump is never skipped by mistake.
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upload: ${{ steps.version.outputs.upload }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check whether MARKETING_VERSION changed
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version_of() {
            sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9][^"[:space:]]*)"?.*$/\1/p' | head -n 1
          }
          current=$(version_of < apps/apple/project.yml)
          if [ -z "$current" ]; then
            echo "::error::Could not read MARKETING_VERSION from apps/apple/project.yml."
            exit 1
          fi
          if [ -z "$BEFORE_SHA" ] || [ "${BEFORE_SHA#*[!0]}" = "$BEFORE_SHA" ] || ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
            echo "::notice::No previous commit to compare with (first push or force push), so the upload goes ahead."
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git show FETCH_HEAD:apps/apple/project.yml 2>/dev/null | version_of || true)
          if [ "$previous" = "$current" ]; then
            echo "::notice::MARKETING_VERSION is still $current, so no TestFlight upload. Apple refuses new builds for a version once it is released. Bump MARKETING_VERSION to ship a new build."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "MARKETING_VERSION changed from '${previous:-none}' to '$current', so the build is uploaded."
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    # A manual run does not archive; see the app-review job. A push that leaves MARKETING_VERSION
    # alone is skipped by the plan job.
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.upload == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.archive.outputs.build_number }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # The PostHog project token (public by design, same as the web build's VITE_POSTHOG_KEY). Unset =
      # the app ships without analytics: it sends nothing and never asks.
      POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
      # The Sentry DSN of the native app's project (maskin-ios). A DSN ships inside the app by design, so it
      # is not a secret. Only this workflow sets it: debug builds, CI compiles and tests report nothing.
      MASKIN_SENTRY_DSN: https://0b63561779279f716f2ffebdbb9afaac@o4510993475960832.ingest.de.sentry.io/4512449147437136
    steps:
      - name: Check signing secrets
        id: gate
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::TestFlight upload skipped: Apple signing secrets are not set yet."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.enabled == 'true'

      - name: Select Xcode 27
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27.x on this runner image."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen and generate the project
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect key
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      # The certificate clean-up script needs Node; the Mac image does not guarantee it.
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 20

      - name: Record the development certificates before the archive
        id: certs_before
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-dev-certs.mjs snapshot "$RUNNER_TEMP/dev-certs-before.json"

      - name: Archive
        id: archive
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/apple
        run: |
          set -euo pipefail
          build_number=$(date -u +%y%m%d%H%M)
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          xcodebuild archive \
            -project Maskin.xcodeproj -scheme Maskin \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maskin.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$build_number" \
            MASKIN_POSTHOG_KEY="$POSTHOG_PROJECT_KEY" \
            MASKIN_SENTRY_DSN="$MASKIN_SENTRY_DSN" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 25
          test "${PIPESTATUS[0]}" -eq 0

      # The debug symbols exist only inside this archive, which disappears with the runner.
      # Kept before the upload so a failed upload still leaves them. Never fails the build.
      - name: Keep the debug symbols
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Maskin-dSYMs-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/Maskin.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 7

      # Sends the same dSYMs to Sentry so crash reports show function names. Skipped when the token
      # secret is not set, and never fails the build: the TestFlight upload below matters more.
      - name: Upload the debug symbols to Sentry
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_IOS }}
          SENTRY_ORG: maskin
          SENTRY_PROJECT: maskin-ios
          # The project's ingest host ends in .de.sentry.io, so the organization lives in the EU region.
          SENTRY_URL: https://de.sentry.io
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::Sentry symbol upload skipped: the SENTRY_AUTH_TOKEN_IOS secret is not set yet."
            exit 0
          fi
          npx --yes @sentry/cli@2 debug-files upload \
            "$RUNNER_TEMP/Maskin.xcarchive/dSYMs"

      - name: Export and upload to TestFlight
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Maskin.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 25
          test "${PIPESTATUS[0]}" -eq 0
          echo "Uploaded build $BUILD_NUMBER to App Store Connect."

      # Runs even when the build failed or was cancelled, so a failed run does not leave
      # certificates behind. Skipped when the snapshot above did not succeed.
      - name: Revoke the development certificates this run created
        if: always() && steps.gate.outputs.enabled == 'true' && steps.certs_before.outcome == 'success'
        continue-on-error: true
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-dev-certs.mjs revoke-new "$RUNNER_TEMP/dev-certs-before.json"

      - name: Remove the key
        if: always() && steps.gate.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Upload logs
        if: (failure() || cancelled()) && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7

  # Apple TV archive and upload, after the iPhone upload (see the header). Same build number as the
  # iPhone build, taken from that job. When the iPhone job did not archive (secrets not set) the
  # build number is empty and this job is skipped. Also skipped until the repository variable
  # APPLE_TV_UPLOAD is true, which is set once the tvOS platform exists on the Maskin app record in App Store Connect.
  # A fresh Mac, so it records and revokes its own development certificates; running after the
  # iPhone job means the two never see each other's.
  testflight-tv:
    needs: testflight
    # always(): a manual signing check runs with the iPhone job skipped, which would skip this job too.
    if: always() && ((needs.testflight.result == 'success' && needs.testflight.outputs.build_number != '' && vars.APPLE_TV_UPLOAD == 'true') || (github.event_name == 'workflow_dispatch' && inputs.tv_signing_check))
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ needs.testflight.outputs.build_number }}
    steps:
      - name: Check signing secrets
        id: gate
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Apple TV upload skipped: Apple signing secrets are not set yet."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.enabled == 'true'

      - name: Select Xcode 26
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26.x on this runner image."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen and generate the project
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect key
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 20

      - name: Record the development certificates before the archive
        id: certs_before
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-dev-certs.mjs snapshot "$RUNNER_TEMP/dev-certs-before.json"

      # No development profile on purpose: the team has no Apple TV registered, so Xcode cannot make
      # a tvOS development profile and the archive fails ("no devices from which to generate a
      # provisioning profile"). The archive is signed ad hoc instead, which still embeds the
      # entitlements (the keychain group the Top Shelf shares with the app), and the export step
      # below re-signs it with the cloud managed distribution certificate and App Store profiles.
      - name: Archive Apple TV
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/apple
        run: |
          set -euo pipefail
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(date -u +%y%m%d%H%M)
            echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          fi
          xcodebuild archive \
            -project Maskin.xcodeproj -scheme MaskinTV \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/MaskinTV.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive-tv.log" | tail -n 25
          test "${PIPESTATUS[0]}" -eq 0

      # An unsigned archive carries no entitlements, and the export would sign without the keychain
      # group the Top Shelf shares with the app. Put them back with an ad hoc signature (codesign
      # allows it, only xcodebuild refuses on tvOS); the export re-signs with the distribution
      # certificate and keeps them. $(AppIdentifierPrefix) is the team id and a dot.
      - name: Put the entitlements back into the archive
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/MaskinTV.xcarchive/Products/Applications/Maskin.app"
          embed() {
            sed "s/\$(AppIdentifierPrefix)/${APPLE_TEAM_ID}./g" "$1" > "$RUNNER_TEMP/entitlements.plist"
            codesign --force --sign - --entitlements "$RUNNER_TEMP/entitlements.plist" "$2"
          }
          embed apps/apple/Apps/MaskinTVTopShelf/MaskinTVTopShelf.entitlements "$app/PlugIns/MaskinTVTopShelf.appex"
          embed apps/apple/Apps/MaskinTV/MaskinTV.entitlements "$app"

      - name: Keep the debug symbols
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Maskin-TV-dSYMs-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/MaskinTV.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 7

      - name: Export and upload to TestFlight
        if: steps.gate.outputs.enabled == 'true'
        env:
          TV_SIGNING_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.tv_signing_check }}
        run: |
          set -euo pipefail
          # A signing check exports to disk and uploads nothing.
          destination=upload
          if [ "$TV_SIGNING_CHECK" = "true" ]; then destination=export; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${destination}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MaskinTV.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-tv" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export-tv.log" | tail -n 25
          test "${PIPESTATUS[0]}" -eq 0
          if [ "$TV_SIGNING_CHECK" = "true" ]; then
            echo "Signing check only: nothing was uploaded."
            ipa=$(ls "$RUNNER_TEMP"/export-tv/*.ipa | head -n 1)
            mkdir -p "$RUNNER_TEMP/ipa-tv" && unzip -q -o "$ipa" -d "$RUNNER_TEMP/ipa-tv"
            app=$(ls -d "$RUNNER_TEMP"/ipa-tv/Payload/*.app | head -n 1)
            for bundle in "$app" "$app"/PlugIns/*.appex; do
              echo "== $bundle"
              codesign -d --entitlements - "$bundle" 2>&1 | grep -E 'keychain|application-identifier' || true
              codesign -d --entitlements - "$bundle" 2>&1 | grep -q 'keychain-access-groups' \
                || { echo "::error::$bundle lost its keychain-access-groups entitlement."; exit 1; }
            done
          else
            echo "Uploaded Apple TV build $BUILD_NUMBER to App Store Connect."
          fi

      - name: Revoke the development certificates this run created
        if: always() && steps.gate.outputs.enabled == 'true' && steps.certs_before.outcome == 'success'
        continue-on-error: true
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-dev-certs.mjs revoke-new "$RUNNER_TEMP/dev-certs-before.json"

      - name: Remove the key
        if: always() && steps.gate.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Upload logs
        if: (failure() || cancelled()) && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tvos-testflight-logs
          path: |
            ${{ runner.temp }}/archive-tv.log
            ${{ runner.temp }}/export-tv.log
          if-no-files-found: ignore
          retention-days: 7

  # Sends the version to App Review when it was changed on purpose. A Linux job on purpose: it only
  # talks to the App Store Connect API, so a manual dry run needs no Mac, and a failure here never
  # touches the TestFlight upload above. Runs after a push upload, or alone on a manual run.
  # iPhone only: the Apple TV build is uploaded by testflight-tv but not sent to App Review.
  app-review:
    needs: testflight
    if: always() && (needs.testflight.result == 'success' || needs.testflight.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check signing secrets
        id: gate
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::App Review submission skipped: App Store Connect secrets are not set yet."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      # Decides whether to submit and which version. On a push: only when MARKETING_VERSION differs
      # from the commit before the push. No previous commit (first push, force push that dropped
      # it) means no comparison is possible, so nothing is submitted and the log says how to do it
      # by hand. It never fails on that. A scheduled run is a manual run with an empty version and
      # no dry run: it submits the version in project.yml, and the script skips it when that version
      # has no uploaded build.
      - name: Decide what to submit
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_VERSION: ${{ inputs.submit_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          UPLOADED_BUILD: ${{ needs.testflight.outputs.build_number }}
        run: |
          set -euo pipefail
          version_of() {
            sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9][^"[:space:]]*)"?.*$/\1/p' | head -n 1
          }
          current=$(version_of < apps/apple/project.yml)
          if [ -z "$current" ]; then
            echo "::error::Could not read MARKETING_VERSION from apps/apple/project.yml."
            exit 1
          fi

          if [ "$EVENT" = "schedule" ]; then
            { echo "submit=true"; echo "version=$current"; echo "build_number="; echo "dry_run=false"; echo "scheduled=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            if [ -z "$version" ]; then
              if [ "$INPUT_DRY_RUN" != "true" ]; then
                echo "::error::Fill in submit_version (the version to send to App Review), or tick dry run."
                exit 1
              fi
              version="$current"
            fi
            { echo "submit=true"; echo "version=$version"; echo "build_number="; echo "dry_run=$INPUT_DRY_RUN"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "submit=false" >> "$GITHUB_OUTPUT"
          if [ -z "$UPLOADED_BUILD" ]; then
            echo "::notice::No build was uploaded in this run, so there is nothing to submit."
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "${BEFORE_SHA#*[!0]}" = "$BEFORE_SHA" ] || ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
            echo "::notice::No previous commit to compare with (first push or force push). Nothing submitted. To send $current to App Review, run this workflow by hand with submit_version $current."
            exit 0
          fi
          previous=$(git show FETCH_HEAD:apps/apple/project.yml 2>/dev/null | version_of || true)
          if [ "$previous" = "$current" ]; then
            echo "MARKETING_VERSION is still $current, so no App Review submission."
            exit 0
          fi
          echo "MARKETING_VERSION changed from '${previous:-none}' to '$current'."
          { echo "submit=true"; echo "version=$current"; echo "build_number=$UPLOADED_BUILD"; echo "dry_run=false"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.submit == 'true'
        with:
          node-version: 20

      - name: Write the App Store Connect key
        if: steps.plan.outputs.submit == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Submit to App Review
        if: steps.plan.outputs.submit == 'true'
        env:
          SUBMIT_VERSION: ${{ steps.plan.outputs.version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.build_number }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
          SCHEDULED: ${{ steps.plan.outputs.scheduled }}
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-submit-review.mjs

      - name: Remove the key
        if: always() && steps.gate.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"
