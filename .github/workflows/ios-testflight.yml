name: iOS TestFlight

# Signed iOS archive uploaded to TestFlight on every merge to main that changes the Apple
# app. apple.yml stays the unsigned compile check; this workflow is the release path.
#
# Inert until the four secrets below exist: the first step checks for them and every later
# step is skipped, so merging this file before the Apple setup is done does not turn main red.
#
#   APPLE_TEAM_ID          10-character Apple Developer Team ID
#   ASC_KEY_ID             App Store Connect API key id
#   ASC_ISSUER_ID          App Store Connect issuer id
#   ASC_KEY_P8             contents of the AuthKey_XXXX.p8 file (key role: Admin, so Xcode can
#                          create and manage the distribution certificate and profiles)
#
# Signing is automatic and cloud managed: xcodebuild -allowProvisioningUpdates with the API
# key creates the distribution certificate and App Store profiles for io.maskin.app and its
# extensions, so no certificate or profile files live in the repo or in secrets.
#
# Every run starts on a fresh Mac, and automatic signing mints a new development certificate
# on it. Apple caps the certificates per account, so a step at the end of the job revokes the
# development certificates this run created (.github/scripts/asc-dev-certs.mjs). Distribution
# certificates and profiles are never touched.
#
# Build number is a UTC timestamp (yymmddHHMM), always higher than the last upload. The
# marketing version still comes from project.yml.
#
# The debug symbols (dSYMs) of each build are kept as a workflow artifact for 7 days, named
# Maskin-dSYMs-<build number>. Apple's copy cannot be downloaded for a build without bitcode,
# so this is the only way to symbolicate a crash log from a CI build. Each artifact is about
# 400 MB, which is why retention is 7 days and not 14.
#
# Internal testers get the build automatically once App Store Connect finishes processing it,
# if the internal TestFlight group has "Automatic distribution" switched on.
#
# App Review: a merge that changes MARKETING_VERSION in apps/apple/project.yml also sends that
# version to App Review, once the upload is processed (job app-review, .github/scripts/
# asc-submit-review.mjs). Any other merge only uploads, as before. The what's-new text comes from
# apps/apple/release-notes.md ("# <version>" on the first line). The release type is manual: after
# Apple approves, a person releases the version in App Store Connect.
#
# Started by hand (Actions, Run workflow) the workflow does not archive. It reads App Store Connect:
# "dry run" prints what a submission would do and creates nothing; "submit_version" submits that
# version (it also retries a submission that failed, because a later merge with the same version
# never counts as a change). The submit job is separate from the upload job, so a failed
# submission leaves the TestFlight build in place.
#
# One macOS runner for roughly 20-30 minutes per merge (10x the per-minute cost of Linux).

on:
  push:
    branches: [main]
    paths:
      - 'apps/apple/**'
      - '!apps/apple/docs/**'
      - '!apps/apple/Tests/**'
      - '!apps/apple/**/*.md'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read App Store Connect and print what would happen, create nothing'
        type: boolean
        default: true
      submit_version:
        description: 'Version to send to App Review, for example 1.2 (empty = the version in project.yml, dry run only)'
        type: string
        default: ''

# Never cancel an upload half way; queue back-to-back merges instead.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # A manual run does not archive; see the app-review job.
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.archive.outputs.build_number }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # The PostHog project token (public by design, same as the web build's VITE_POSTHOG_KEY). Unset =
      # the app ships without analytics: it sends nothing and never asks.
      POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
    steps:
      - name: Check signing secrets
        id: gate
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::TestFlight upload skipped: Apple signing secrets are not set yet."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.enabled == 'true'

      - name: Select Xcode 26
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26.x on this runner image."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen and generate the project
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect key
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      # The certificate clean-up script needs Node; the Mac image does not guarantee it.
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 20

      - name: Record the development certificates before the archive
        id: certs_before
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-dev-certs.mjs snapshot "$RUNNER_TEMP/dev-certs-before.json"

      - name: Archive
        id: archive
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/apple
        run: |
          set -euo pipefail
          build_number=$(date -u +%y%m%d%H%M)
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          xcodebuild archive \
            -project Maskin.xcodeproj -scheme Maskin \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maskin.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$build_number" \
            MASKIN_POSTHOG_KEY="$POSTHOG_PROJECT_KEY" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 25
          test "${PIPESTATUS[0]}" -eq 0

      # The debug symbols exist only inside this archive, which disappears with the runner.
      # Kept before the upload so a failed upload still leaves them. Never fails the build.
      - name: Keep the debug symbols
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Maskin-dSYMs-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/Maskin.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 7

      - name: Export and upload to TestFlight
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Maskin.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 25
          test "${PIPESTATUS[0]}" -eq 0
          echo "Uploaded build $BUILD_NUMBER to App Store Connect."

      # Runs even when the build failed or was cancelled, so a failed run does not leave
      # certificates behind. Skipped when the snapshot above did not succeed.
      - name: Revoke the development certificates this run created
        if: always() && steps.gate.outputs.enabled == 'true' && steps.certs_before.outcome == 'success'
        continue-on-error: true
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-dev-certs.mjs revoke-new "$RUNNER_TEMP/dev-certs-before.json"

      - name: Remove the key
        if: always() && steps.gate.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Upload logs
        if: (failure() || cancelled()) && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7

  # Sends the version to App Review when it was changed on purpose. A Linux job on purpose: it only
  # talks to the App Store Connect API, so a manual dry run needs no Mac, and a failure here never
  # touches the TestFlight upload above. Runs after a push upload, or alone on a manual run.
  app-review:
    needs: testflight
    if: always() && (needs.testflight.result == 'success' || needs.testflight.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check signing secrets
        id: gate
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::App Review submission skipped: App Store Connect secrets are not set yet."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      # Decides whether to submit and which version. On a push: only when MARKETING_VERSION differs
      # from the commit before the push. No previous commit (first push, force push that dropped
      # it) means no comparison is possible, so nothing is submitted and the log says how to do it
      # by hand. It never fails on that.
      - name: Decide what to submit
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_VERSION: ${{ inputs.submit_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          UPLOADED_BUILD: ${{ needs.testflight.outputs.build_number }}
        run: |
          set -euo pipefail
          version_of() {
            sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9][^"[:space:]]*)"?.*$/\1/p' | head -n 1
          }
          current=$(version_of < apps/apple/project.yml)
          if [ -z "$current" ]; then
            echo "::error::Could not read MARKETING_VERSION from apps/apple/project.yml."
            exit 1
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            if [ -z "$version" ]; then
              if [ "$INPUT_DRY_RUN" != "true" ]; then
                echo "::error::Fill in submit_version (the version to send to App Review), or tick dry run."
                exit 1
              fi
              version="$current"
            fi
            { echo "submit=true"; echo "version=$version"; echo "build_number="; echo "dry_run=$INPUT_DRY_RUN"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "submit=false" >> "$GITHUB_OUTPUT"
          if [ -z "$UPLOADED_BUILD" ]; then
            echo "::notice::No build was uploaded in this run, so there is nothing to submit."
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "${BEFORE_SHA#*[!0]}" = "$BEFORE_SHA" ] || ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
            echo "::notice::No previous commit to compare with (first push or force push). Nothing submitted. To send $current to App Review, run this workflow by hand with submit_version $current."
            exit 0
          fi
          previous=$(git show FETCH_HEAD:apps/apple/project.yml 2>/dev/null | version_of || true)
          if [ "$previous" = "$current" ]; then
            echo "MARKETING_VERSION is still $current, so no App Review submission."
            exit 0
          fi
          echo "MARKETING_VERSION changed from '${previous:-none}' to '$current'."
          { echo "submit=true"; echo "version=$current"; echo "build_number=$UPLOADED_BUILD"; echo "dry_run=false"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.submit == 'true'
        with:
          node-version: 20

      - name: Write the App Store Connect key
        if: steps.plan.outputs.submit == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Submit to App Review
        if: steps.plan.outputs.submit == 'true'
        env:
          SUBMIT_VERSION: ${{ steps.plan.outputs.version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.build_number }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
        run: |
          ASC_KEY_P8_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            node .github/scripts/asc-submit-review.mjs

      - name: Remove the key
        if: always() && steps.gate.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"
