name: Apple development certificates cleanup (one-off)

# Manual run only. Apple stops issuing signing profiles once the account holds its maximum
# number of certificates, and every ios-testflight.yml run on a fresh Mac mints a new
# development certificate. This job clears them through the App Store Connect API, using the
# same key secrets as ios-testflight.yml, so no Apple login or 2FA code is needed.
#
#   mode=list    prints every certificate (type, name, expiry) and marks which ones revoke
#                would select. Changes nothing.
#   mode=revoke  revokes only certificates that are development type AND named "Created via
#                API" (the CI-made ones). Every other certificate is skipped and printed, so
#                people's development certificates, distribution, Developer ID and installer
#                certificates are never touched. It refuses to run unless the selection is
#                exactly 10 and expected_dev_count equals it. It prints the full list before
#                and after, and fails if any skipped certificate disappeared.
#
# The key and the token are never printed. Remove this file once the TestFlight build is green.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = read only, revoke = revoke the CI development certificates'
        type: choice
        options: [list, revoke]
        default: list
      expected_dev_count:
        description: 'revoke only: must be exactly 10 and equal the CI certificates the list run selected'
        type: string
        default: ''

jobs:
  certs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MODE: ${{ inputs.mode }}
      EXPECTED_DEV_COUNT: ${{ inputs.expected_dev_count }}
    steps:
      - name: List or revoke the CI development certificates
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 is not set."
            exit 1
          fi
          node --input-type=module <<'EOF'
          import { createPrivateKey, sign } from 'node:crypto';

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, MODE, EXPECTED_DEV_COUNT } = process.env;
          const API = 'https://api.appstoreconnect.apple.com';
          const DEV_TYPES = new Set(['DEVELOPMENT', 'IOS_DEVELOPMENT', 'MAC_APP_DEVELOPMENT']);
          const CI_NAME = 'created via api';
          const CI_COUNT = 10;
          // Ids of the people's development certificates seen in the list run on 30 Oct 2026.
          // If one of these is ever selected, something is wrong with the name match: stop.
          const PROTECTED_IDS = new Set(['Q297X34H9V', 'XXXB36AUJ6']);

          const b64url = (v) => Buffer.from(v).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const signingInput =
            b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' })) + '.' +
            b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }));
          const signature = sign('sha256', Buffer.from(signingInput), {
            key: createPrivateKey(ASC_KEY_P8),
            dsaEncoding: 'ieee-p1363',
          });
          const token = signingInput + '.' + b64url(signature);

          async function asc(method, path) {
            const res = await fetch(API + path, {
              method,
              headers: { Authorization: `Bearer ${token}` },
            });
            const text = await res.text();
            if (!res.ok) {
              console.error(`::error::${method} ${path} -> ${res.status}: ${text}`);
              process.exit(1);
            }
            return text ? JSON.parse(text) : {};
          }

          async function listCerts() {
            const all = [];
            let path = '/v1/certificates?limit=200&fields[certificates]=name,displayName,certificateType,platform,expirationDate';
            while (path) {
              const page = await asc('GET', path);
              all.push(...page.data);
              path = page.links && page.links.next ? page.links.next.replace(API, '') : null;
            }
            return all;
          }

          const certName = (c) => c.attributes.displayName || c.attributes.name || '';
          const isCiDev = (c) =>
            DEV_TYPES.has(c.attributes.certificateType) && certName(c).toLowerCase().includes(CI_NAME);

          function print(title, certs) {
            console.log(`--- ${title}: ${certs.length} certificates ---`);
            const rows = certs
              .map((c) => ({
                id: c.id,
                type: c.attributes.certificateType,
                name: certName(c),
                expires: (c.attributes.expirationDate || '').slice(0, 10),
                pick: isCiDev(c) ? 'REVOKE' : 'KEEP  ',
              }))
              .sort((a, b) => a.pick.localeCompare(b.pick) || a.type.localeCompare(b.type) || a.expires.localeCompare(b.expires));
            for (const r of rows) {
              console.log(`${r.pick}  ${r.type.padEnd(22)} expires ${r.expires}  ${r.name}  [${r.id}]`);
            }
          }

          const certs = await listCerts();
          const targets = certs.filter(isCiDev);
          const skipped = certs.filter((c) => !isCiDev(c));
          console.log(`Certificates on the account: ${certs.length} (selected for revoke ${targets.length}, kept ${skipped.length}).`);
          print('Before', certs);

          if (MODE === 'list') {
            console.log('List mode: nothing was changed.');
            process.exit(0);
          }
          if (MODE !== 'revoke') {
            console.error(`::error::Unknown mode ${MODE}.`);
            process.exit(1);
          }
          const hit = targets.filter((c) => PROTECTED_IDS.has(c.id));
          if (hit.length > 0) {
            console.error(`::error::Protected certificate(s) ${hit.map((c) => c.id).join(', ')} match the CI name. Stopping without changes.`);
            process.exit(1);
          }
          if (targets.length !== CI_COUNT) {
            console.error(`::error::${targets.length} certificates are selected but exactly ${CI_COUNT} are expected. Stopping without changes.`);
            process.exit(1);
          }
          if (EXPECTED_DEV_COUNT !== String(CI_COUNT) || EXPECTED_DEV_COUNT !== String(targets.length)) {
            console.error(`::error::expected_dev_count is "${EXPECTED_DEV_COUNT}" but it must be ${CI_COUNT} and equal the ${targets.length} selected. Stopping without changes.`);
            process.exit(1);
          }

          for (const c of targets) {
            await asc('DELETE', `/v1/certificates/${c.id}`);
            console.log(`Revoked ${c.attributes.certificateType} ${c.id}`);
          }
          const after = await listCerts();
          print('After', after);
          const afterIds = new Set(after.map((c) => c.id));
          const lost = skipped.filter((c) => !afterIds.has(c.id));
          const left = targets.filter((c) => afterIds.has(c.id));
          console.log(`Count after: ${after.length} total (was ${certs.length}), kept ${skipped.length - lost.length} of ${skipped.length}, ${left.length} selected still present.`);
          if (lost.length > 0) {
            console.error(`::error::Kept certificate(s) disappeared: ${lost.map((c) => c.id).join(', ')}`);
            process.exit(1);
          }
          if (left.length > 0) {
            console.error(`::error::Selected certificate(s) still present: ${left.map((c) => c.id).join(', ')}`);
            process.exit(1);
          }
          EOF
