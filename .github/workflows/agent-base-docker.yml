name: Build & Push agent-base Docker image

on:
  push:
    branches: [main]
    paths:
      - 'docker/agent-base/**'

concurrency:
  group: agent-base-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.AGENT_BASE_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Resolve the SHAs the image is pinned to. MASKIN_REF is the SHA that
      # triggered this build (GITHUB_SHA on the push event to main). SKJALD_REF
      # comes from the skjald repo's main HEAD at build time so the baked
      # node_modules matches whatever a sibling skjald session would resolve to.
      #
      # These two SHAs are sampled independently: a maskin build can race a
      # skjald merge, so the baked skjald layer may briefly trail tip-of-main.
      # T4 (CI rebuild on lockfile bump) owns refreshing the image whenever
      # either pnpm-lock.yaml moves on main, which is the contract that keeps
      # the baked store from drifting from the lockfile.
      - name: Resolve repo refs
        id: refs
        env:
          SKJALD_TOKEN: ${{ secrets.SKJALD_READ_TOKEN }}
        run: |
          set -euo pipefail
          maskin_ref="${GITHUB_SHA}"
          skjald_ref=$(curl -fsSL \
            -H "Authorization: Bearer ${SKJALD_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sindre-ai/skjald/branches/main \
            | jq -r '.commit.sha')
          if [ -z "$skjald_ref" ] || [ "$skjald_ref" = "null" ]; then
            echo "Failed to resolve skjald main SHA" >&2
            exit 1
          fi
          echo "maskin_ref=${maskin_ref}" >> "$GITHUB_OUTPUT"
          echo "skjald_ref=${skjald_ref}" >> "$GITHUB_OUTPUT"

      # The skjald clone is private — the token is mounted as a BuildKit
      # secret so it never reaches an image layer or `.git/config`. The
      # Dockerfile rewrites the auth-bearing remote URL back to the plain
      # https form after each clone.
      - name: Write build secret
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${{ secrets.SKJALD_READ_TOKEN }}" > "$RUNNER_TEMP/github_token"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/agent-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MASKIN_REF=${{ steps.refs.outputs.maskin_ref }}
            SKJALD_REF=${{ steps.refs.outputs.skjald_ref }}
          secret-files: |
            github_token=${{ runner.temp }}/github_token

      - name: Prune old SHA tags (keep latest 10)
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE: ${{ vars.AGENT_BASE_IMAGE }}
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}')" \
            | jq -r '.token')

          # Fetch all SHA tags (sha-*), sort by last_updated ascending so oldest are first
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/$IMAGE/tags?page_size=100" \
            | jq -r '[.results[] | select(.name | startswith("sha-"))] | sort_by(.last_updated) | .[].name')

          COUNT=$(echo "$TAGS" | grep -c .) || COUNT=0
          KEEP=10
          DELETE_COUNT=$((COUNT - KEEP))

          if [ "$DELETE_COUNT" -gt 0 ]; then
            echo "Deleting $DELETE_COUNT old SHA tag(s)..."
            echo "$TAGS" | head -n "$DELETE_COUNT" | while read TAG; do
              echo "  Deleting sha tag: $TAG"
              curl -s -X DELETE "https://hub.docker.com/v2/repositories/$IMAGE/tags/$TAG/" \
                -H "Authorization: Bearer $TOKEN"
            done
          else
            echo "Only $COUNT SHA tag(s) exist — nothing to prune."
          fi

      - name: Restart agent-server to pick up new image
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AGENT_SERVER_HOST }}
          username: ${{ secrets.AGENT_SERVER_USER }}
          key: ${{ secrets.AGENT_SERVER_SSH_KEY }}
          script: systemctl restart maskin-agent-server
