name: skjald-dmg-check

on:
  push:
    branches: [infra/skjald-dmg-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download hosted DMG
        run: |
          curl -fsSL -o Skjald.dmg https://downloads.vaerksted.ai/Skjald-latest.dmg
          ls -l Skjald.dmg
          shasum -a 256 Skjald.dmg
          sw_vers
          uname -m

      - name: DMG signature, ticket, Gatekeeper
        run: |
          t() { perl -e 'alarm 60; exec @ARGV' -- "$@"; echo "exit=$?"; }
          echo "== codesign -dv (DMG)"; codesign -dv --verbose=4 Skjald.dmg 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|Timestamp|Format|flags'
          echo "== codesign --verify (DMG)"; t codesign --verify --strict --verbose=2 Skjald.dmg
          echo "== stapler validate (DMG)"; t xcrun stapler validate Skjald.dmg
          echo "== spctl open/primary-signature (DMG)"; t spctl -a -t open --context context:primary-signature -vvv Skjald.dmg
          exit 0

      - name: App inside the DMG
        run: |
          t() { perl -e 'alarm 60; exec @ARGV' -- "$@"; echo "exit=$?"; }
          echo "== attach"
          yes | perl -e 'alarm 90; exec @ARGV' -- hdiutil attach Skjald.dmg -nobrowse -readonly -noverify -mountpoint /tmp/skjald
          echo "attach exit=${PIPESTATUS[1]}"
          ls /tmp/skjald || exit 0
          APP=$(ls -d /tmp/skjald/*.app | head -1)
          echo "APP=$APP"
          cp -R "$APP" /tmp/Skjald.app
          hdiutil detach /tmp/skjald -force || true
          APP=/tmp/Skjald.app
          echo "== Info.plist"
          for k in CFBundleShortVersionString CFBundleVersion LSMinimumSystemVersion CFBundleExecutable; do
            printf '%s=' "$k"; /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Contents/Info.plist" 2>&1
          done
          echo "== archs"
          for f in "$APP/Contents/MacOS/"*; do printf '%s: ' "$(basename "$f")"; lipo -archs "$f" 2>&1; done
          echo "== codesign -dv (app)"; codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|Timestamp|flags|Notarization'
          echo "== codesign --verify --deep --strict (app)"; t codesign --verify --deep --strict --verbose=2 "$APP"
          echo "== stapler validate (app)"; t xcrun stapler validate "$APP"
          echo "== spctl exec, no quarantine"; t spctl -a -t exec -vvv "$APP"
          echo "== spctl exec, with quarantine flag"
          xattr -w com.apple.quarantine "0083;$(printf '%x' $(date +%s));Safari;" "$APP"
          t spctl -a -t exec -vvv "$APP"
          exit 0
