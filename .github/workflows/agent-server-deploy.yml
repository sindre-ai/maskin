name: Deploy agent-server

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent-server/**'
      - 'packages/storage/**'
  workflow_dispatch: {}

concurrency:
  group: agent-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: git pull, build, restart on agent-server host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AGENT_SERVER_HOST }}
          username: ${{ secrets.AGENT_SERVER_USER }}
          key: ${{ secrets.AGENT_SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/maskin

            git fetch origin main
            git reset --hard origin/main

            pnpm install --frozen-lockfile
            pnpm turbo run build --filter=@maskin/agent-server...

            # Sync the systemd unit from the repo before restarting.
            #
            # agent-server is NOT containerised — it runs as a plain Node
            # process started by systemd (ExecStart=/usr/bin/node ...), so how
            # it runs lives in a unit file under /etc, separate from the code
            # under /opt/maskin. Without this step the deploy updates the code
            # and never the unit, so any change to restart behaviour, kill
            # mode, journald rate limiting or environment sits in the repo
            # doing nothing until somebody remembers to ssh in and copy it.
            # That drift is silent and can persist for months.
            #
            # (The agent-base / browser-sidecar images DO ship automatically,
            # but those are the images sessions run inside — not this service.)
            UNIT_SRC=apps/agent-server/systemd/maskin-agent-server.service
            UNIT_DST=/etc/systemd/system/maskin-agent-server.service

            # Check the unit parses before installing it. This gates on fatal
            # errors only — systemd-analyze exits 1 for things like a missing
            # ExecStart, but merely WARNS (exit 0) on an unrecognised value
            # such as KillMode=typo, which it silently ignores at runtime. So
            # the output is echoed too: a warning here means a setting you
            # think is applied is not.
            systemd-analyze verify "$UNIT_SRC"

            if ! cmp -s "$UNIT_SRC" "$UNIT_DST"; then
              echo "unit file changed — installing and reloading systemd"
              install -m 644 -o root -g root "$UNIT_SRC" "$UNIT_DST"
              systemctl daemon-reload
            else
              echo "unit file unchanged"
            fi

            # KillMode=process on this unit means a restart only replaces the
            # dispatcher — live microVM sessions are left running untouched.
            systemctl restart maskin-agent-server

            for i in $(seq 1 15); do
              if curl -sf http://localhost:3001/health > /dev/null; then
                echo "maskin-agent-server healthy after restart"
                exit 0
              fi
              sleep 2
            done
            echo "maskin-agent-server did not become healthy within 30s after restart" >&2
            exit 1
