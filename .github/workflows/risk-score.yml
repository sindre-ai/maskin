name: Risk Score

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue needs maskin/risk-score on its temporary merge commit too, or the
  # required check never arrives there. See the risk-score-merge-group job.
  merge_group:

concurrency:
  # pull_request.number is empty on merge_group; without the ref fallback every queue
  # entry would share one group and cancel the others.
  group: risk-score-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # Scores the PR diff. pull_request only: it reads the PR's base and head shas,
  # which a merge_group event does not carry.
  risk-score:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maskin/risk-classifier build

      # squawk (github.com/sbdchd/squawk) lints .sql files for blocking-lock
      # migrations. Without this step the `squawk_blocking_lock` signal and the
      # hot-table floor in .maskin/hot-tables.yml can never fire on ubuntu-latest,
      # since squawk isn't preinstalled on the runner image. Version is pinned
      # for determinism — bump deliberately alongside a SKILL_VERSION bump.
      - name: Install squawk
        run: |
          curl -sSfL -o /usr/local/bin/squawk \
            https://github.com/sbdchd/squawk/releases/download/v2.59.0/squawk-linux-x64
          chmod +x /usr/local/bin/squawk
          squawk --version

      # R4 (risk-gate skill): a floor file that's missing or fails to parse must
      # fail the check loudly, not degrade to "no floors" silently. This is what
      # both risk-classifier bets asked for — see .maskin/*.yml and
      # packages/risk-classifier/src/lib/assert-config.ts.
      - name: Assert risk-classifier floor configs resolve
        run: node packages/risk-classifier/bin/assert-risk-config.mjs --repo .

      - name: Run risk-classifier
        run: |
          # `risk-classifier.mjs` exits 1/2 for a non-auto band by design (see
          # cli.ts) — that must not abort this step under bash's default -e,
          # or the check-run below never posts for exactly the risky PRs this
          # workflow exists to flag. `|| true` neutralizes that exit code; a
          # genuine adapter crash still fails the job below, since it leaves
          # risk-score-check-run.json empty/invalid and JSON.parse throws.
          node packages/risk-classifier/bin/risk-classifier.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repo . \
            --output check-run > risk-score-check-run.json || true
          cat risk-score-check-run.json

      - name: Post maskin/risk-score check run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const result = JSON.parse(fs.readFileSync('risk-score-check-run.json', 'utf8'))
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: result.name,
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: result.conclusion,
              output: {
                title: `Risk score: ${result.conclusion}`,
                summary: result.summary,
              },
            })
            if (result.conclusion === 'failure') {
              core.setFailed(`Risk score requires human review: ${result.summary}`)
            }

  # A PR reaches the merge queue only after its score was read on the PR (a failure
  # there means a person had to review it), so the queue entry is not scored again:
  # the merge group diff also holds the PRs ahead of it and would flag them to this
  # one. This job only posts the required maskin/risk-score check run, as a pass, on
  # the merge group commit so the queue can proceed.
  risk-score-merge-group:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Post maskin/risk-score check run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'maskin/risk-score',
              head_sha: context.payload.merge_group.head_sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Risk score: scored on the pull request',
                summary: 'Merge queue entry. The risk score was computed on the pull request and is not recomputed on the merge group.',
              },
            })
