services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a fresh staging password}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal only: no host port, no metrics port, keys come from env (no default).
  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<CONF
        {"identities":[{"name":"staging","credentials":[{"accessKey":"${S3_ACCESS_KEY:?set a fresh staging key}","secretKey":"${S3_SECRET_KEY:?set a fresh staging secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweed_data:/data

  # Staging for bet/dbe5-claude-oauth-connect. Differences from docker-compose.prod.yml:
  # no /var/run/docker.sock mount (so no agent sessions here), no agent-base build,
  # no GitHub App, no Resend, no prod PostHog. Do not add them back.
  app:
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
      args:
        VITE_MASKIN_COMMIT_SHA: ${SOURCE_COMMIT:-}
    # TEMPORARY: the node one-liner is the A11 headers-only probe. One plain HEAD
    # request to / on port 80 of each address, no redirects followed, no body read,
    # no other path, no credentials. Prints the status line and Server header to the
    # app log, then the app starts as usual. Remove it once the result is posted.
    command:
      - sh
      - -c
      - |
        node -e "
        const http=require('http');
        const head=(h)=>new Promise(r=>{const q=http.request({host:h,port:80,path:'/',method:'HEAD',timeout:5000,agent:false},res=>{r('HEAD http://'+h+'/ -> HTTP/'+res.httpVersion+' '+res.statusCode+' '+res.statusMessage+' | Server: '+(res.headers.server||'(none)'));res.destroy()});q.on('timeout',()=>{q.destroy();r('HEAD http://'+h+'/ -> timeout')});q.on('error',e=>r('HEAD http://'+h+'/ -> error '+e.code));q.end()});
        (async()=>{
        console.log('PROBE START '+new Date().toISOString());
        const out=await Promise.all(['169.254.169.254','10.0.0.1','10.0.3.1'].map(head));
        out.forEach(x=>console.log(x));
        console.log('PROBE END');
        })();
        "
        node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      APP_URL: https://staging.maskin.sindre.ai
      # Claude sign-in (MCP OAuth) test. Listed explicitly: compose only passes
      # what is named here.
      MASKIN_MCP_OAUTH_ENABLED: ${MASKIN_MCP_OAUTH_ENABLED:-true}
      MASKIN_OAUTH_ISSUER: ${MASKIN_OAUTH_ISSUER:-https://staging.maskin.sindre.ai}
      # Tester flag vars (see .claude/rules/feature-flags.md). Unregistered flag ids
      # resolve to false. Leave actor ids empty until a staging user exists.
      FF_TESTER_ACTOR_IDS: ${FF_TESTER_ACTOR_IDS:-}
      FF_TESTER_FEATURES: ${FF_TESTER_FEATURES:-mcp-oauth-consent}
      # THROWAWAY smoke-test stub (never merge): the tester account's API key, read by oauth-smoke-stub.ts.
      SMOKE_STUB_API_KEY: ${SMOKE_STUB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_data:
