services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a fresh staging password}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal only: no host port, no metrics port, keys come from env (no default).
  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<CONF
        {"identities":[{"name":"staging","credentials":[{"accessKey":"${S3_ACCESS_KEY:?set a fresh staging key}","secretKey":"${S3_SECRET_KEY:?set a fresh staging secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweed_data:/data

  # Staging for bet/dbe5-claude-oauth-connect. Differences from docker-compose.prod.yml:
  # no /var/run/docker.sock mount (so no agent sessions here), no agent-base build,
  # no GitHub App, no Resend, no prod PostHog. Do not add them back.
  app:
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
      args:
        VITE_MASKIN_COMMIT_SHA: ${SOURCE_COMMIT:-}
    # TEMPORARY: the node one-liner is the A2 and A11 egress probe. It runs once
    # from this container (same network and firewall path as the app), prints
    # PROBE START to PROBE END to the app log, then the app starts as usual.
    # Remove it once the result is posted on the staging task.
    command:
      - sh
      - -c
      - |
        node -e "
        const net=require('net'),dns=require('dns'),fs=require('fs');
        const tcp=(h)=>new Promise(r=>{const s=net.connect({host:h,port:80});s.setTimeout(5000);s.on('connect',()=>{s.destroy();r('CONNECTED')});s.on('timeout',()=>{s.destroy();r('no-connect (timeout)')});s.on('error',e=>r('no-connect ('+e.code+')'))});
        let gw='unknown';
        try{const l=fs.readFileSync('/proc/net/route','utf8').split('\n').slice(1).find(x=>x.split('\t')[1]==='00000000');if(l){const h=l.split('\t')[2];gw=[6,4,2,0].map(i=>parseInt(h.substr(i,2),16)).join('.')}}catch(e){}
        const hosts=['169.254.169.254','10.0.0.1','172.17.0.1','192.168.0.1'];
        if(gw!=='unknown'&&!hosts.includes(gw))hosts.push(gw);
        (async()=>{
        console.log('PROBE START '+new Date().toISOString()+' gateway='+gw);
        const a2=dns.promises.lookup('claude.ai').then(x=>'A2 dns claude.ai: '+x.address,e=>'A2 dns claude.ai: FAIL '+e.code);
        const a2h=fetch('https://claude.ai/oauth/mcp-oauth-client-metadata',{signal:AbortSignal.timeout(5000)}).then(r=>'A2 metadata http: '+r.status,e=>'A2 metadata http: fetch-failed '+((e.cause&&e.cause.code)||e.name));
        const a11=hosts.map(h=>tcp(h).then(x=>'A11 '+h+':80 '+x));
        (await Promise.all([a2,a2h,...a11])).forEach(x=>console.log(x));
        console.log('PROBE END');
        })();
        "
        node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      APP_URL: https://staging.maskin.sindre.ai
      # Claude sign-in (MCP OAuth) test. Listed explicitly: compose only passes
      # what is named here.
      MASKIN_MCP_OAUTH_ENABLED: ${MASKIN_MCP_OAUTH_ENABLED:-true}
      MASKIN_OAUTH_ISSUER: ${MASKIN_OAUTH_ISSUER:-https://staging.maskin.sindre.ai}
      # Tester flag vars (see .claude/rules/feature-flags.md). Unregistered flag ids
      # resolve to false. Leave actor ids empty until a staging user exists.
      FF_TESTER_ACTOR_IDS: ${FF_TESTER_ACTOR_IDS:-}
      FF_TESTER_FEATURES: ${FF_TESTER_FEATURES:-mcp-oauth-consent}
      # THROWAWAY smoke-test stub (never merge): the tester account's API key, read by oauth-smoke-stub.ts.
      SMOKE_STUB_API_KEY: ${SMOKE_STUB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_data:
