services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a fresh staging password}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal only: no host port, no metrics port, keys come from env (no default).
  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<CONF
        {"identities":[{"name":"staging","credentials":[{"accessKey":"${S3_ACCESS_KEY:?set a fresh staging key}","secretKey":"${S3_SECRET_KEY:?set a fresh staging secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweed_data:/data

  # Staging proof for bet/b466fa48-flows-run-like-development (task_ready wake and the sweep).
  # Differences from docker-compose.prod.yml: no /var/run/docker.sock mount (no local agent
  # sessions), no agent-base build, no GitHub App, no Resend, no prod PostHog. Sessions run on a
  # separate agent-server registered through AGENT_SERVERS. Do not add the prod pieces back.
  # Staging only, never merge.
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
      args:
        VITE_MASKIN_COMMIT_SHA: ${SOURCE_COMMIT:-}
    command: ["sh", "-c", "node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      APP_URL: ${SERVICE_URL_APP}
      FRONTEND_URL: ${SERVICE_URL_APP}
      MASKIN_BACKEND_URL: ${SERVICE_URL_APP}
      MASKIN_MCP_OAUTH_ENABLED: ${MASKIN_MCP_OAUTH_ENABLED:-true}
      MASKIN_OAUTH_ISSUER: ${SERVICE_URL_APP}
      # Tester flag vars (see .claude/rules/feature-flags.md). Unregistered flag ids
      # resolve to false. Workspace flags are set after the first sign-up, then restart.
      FF_TESTER_ACTOR_IDS: ${FF_TESTER_ACTOR_IDS:-}
      FF_TESTER_FEATURES: ${FF_TESTER_FEATURES:-mcp-oauth-consent}
      FF_WORKSPACE_FEATURES: ${FF_WORKSPACE_FEATURES:-}
      # Agent server for woken sessions, and the model route (a new workspace is on the
      # trial plan, so it goes through the funded OpenRouter key, capped by the trial cap).
      AGENT_BASE_IMAGE: magnusnoeddegaard/agent-base:latest
      AGENT_SERVERS: ${AGENT_SERVERS:-}
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:-}
      MASKIN_FALLBACK_OPENROUTER_KEY: ${MASKIN_FALLBACK_OPENROUTER_KEY:-}
      MASKIN_TRIAL_HARD_CAP_USD_CENTS: ${MASKIN_TRIAL_HARD_CAP_USD_CENTS:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_data:
