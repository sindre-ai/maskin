services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a fresh staging password}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal only: no host port, keys come from env (no default).
  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<CONF
        {"identities":[{"name":"staging","credentials":[{"accessKey":"${S3_ACCESS_KEY:?set a fresh staging key}","secretKey":"${S3_SECRET_KEY:?set a fresh staging secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweed_data:/data

  # Staging for the trial card step (PR 3172). Stripe TEST mode only: the keys in the Coolify
  # settings of this app must be sk_test_ / pk_test_ / a test-mode webhook secret.
  # Differences from docker-compose.prod.yml: no /var/run/docker.sock mount (no agent sessions
  # here), no agent-base build, no GitHub App, no Resend, no prod PostHog. This shares a host
  # with prod: do not add them back. Staging only, never merge.
  app:
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
      args:
        VITE_MASKIN_COMMIT_SHA: ${SOURCE_COMMIT:-}
    command:
      - sh
      - -c
      - |
        node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      APP_URL: ${SERVICE_URL_APP}
      FRONTEND_URL: ${SERVICE_URL_APP}
      MASKIN_BACKEND_URL: ${SERVICE_URL_APP}
      # The card step is on for every sign-up on this copy only.
      FF_SIGNUP_FEATURES: ${FF_SIGNUP_FEATURES:-trial-card-percent}
      # Stripe test mode. The webhook refuses to run without the two old dollar prices
      # (test-mode ids), even though the card step never uses them.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      MASKIN_TRIAL_HARD_CAP_USD_CENTS: ${MASKIN_TRIAL_HARD_CAP_USD_CENTS:-286}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_data:
