services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a fresh test password}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal only: no host port, keys come from env (no default).
  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<CONF
        {"identities":[{"name":"staging","credentials":[{"accessKey":"${S3_ACCESS_KEY:?set a fresh test key}","secretKey":"${S3_SECRET_KEY:?set a fresh test secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweed_data:/data

  # Throwaway app for the standing-rule gate on PR 3709. Based on the agent-server-test staging
  # compose: no /var/run/docker.sock (sessions run on the separate test agent-server via
  # AGENT_SERVERS), no GitHub App, no Resend, no PostHog key. Adds CHAT_ROTATION_ENABLED and the
  # funded DeepSeek route. Not an enterprise workspace, so the funded route applies.
  # Never merge. Never use on production.
  app:
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
      args:
        VITE_MASKIN_COMMIT_SHA: ${SOURCE_COMMIT:-}
    command:
      - sh
      - -c
      - |
        node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      APP_URL: ${GATE_BASE_URL}
      FRONTEND_URL: ${GATE_BASE_URL}
      MASKIN_BACKEND_URL: ${GATE_BASE_URL}
      AGENT_BASE_IMAGE: magnusnoeddegaard/agent-base:latest
      AGENT_SERVERS: ${AGENT_SERVERS:-}
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:-}
      # The switch under test, and the funded DeepSeek route (same names as production).
      CHAT_ROTATION_ENABLED: ${CHAT_ROTATION_ENABLED:-true}
      MASKIN_FALLBACK_BASE_URL: ${MASKIN_FALLBACK_BASE_URL:-https://openrouter.ai/api}
      MASKIN_FALLBACK_OPENROUTER_KEY: ${MASKIN_FALLBACK_OPENROUTER_KEY:-}
      MASKIN_FALLBACK_MODEL: ${MASKIN_FALLBACK_MODEL:-}
      MASKIN_FALLBACK_SMALL_MODEL: ${MASKIN_FALLBACK_SMALL_MODEL:-}
      MASKIN_FALLBACK_PROVIDER_ONLY: ${MASKIN_FALLBACK_PROVIDER_ONLY:-}
      MASKIN_FALLBACK_PROVIDER_IGNORE: ${MASKIN_FALLBACK_PROVIDER_IGNORE:-}
      MASKIN_FALLBACK_DAILY_TOKEN_LIMIT: ${MASKIN_FALLBACK_DAILY_TOKEN_LIMIT:-5000000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_data:
