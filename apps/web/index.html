<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Maskin Workspace</title>
		<link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Prevent FOUC: apply theme class before first paint
			(function() {
				// Migrate old key
				var old = localStorage.getItem('ai-native-theme');
				if (old && !localStorage.getItem('maskin-theme')) {
					localStorage.setItem('maskin-theme', old);
					localStorage.removeItem('ai-native-theme');
				}
				var theme = localStorage.getItem('maskin-theme') || 'light';
				if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
