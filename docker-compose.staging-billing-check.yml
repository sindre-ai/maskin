services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a fresh staging password}
      POSTGRES_DB: ${POSTGRES_DB:-maskin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<CONF
        {"identities":[{"name":"staging","credentials":[{"accessKey":"${S3_ACCESS_KEY:?set a fresh staging key}","secretKey":"${S3_SECRET_KEY:?set a fresh staging secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        CONF
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweed_data:/data

  # Throwaway verification copy for "Check billing events after deploy". Stripe TEST mode
  # keys only, and the PostHog key so the test events land in our project with livemode false.
  # Same rules as docker-compose.staging.yml: no Docker socket, no agent-base build, no
  # GitHub App, no Resend. Staging only, never merge.
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/dev/Dockerfile
      args:
        VITE_MASKIN_COMMIT_SHA: ${SOURCE_COMMIT:-}
    command:
      - sh
      - -c
      - |
        node packages/db/dist/migrate.js && pnpm --filter @maskin/dev exec tsx scripts/seed-marketplace.ts && node apps/dev/dist/index.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskin}
      PORT: "3000"
      NODE_ENV: production
      STATIC_DIR: /app/apps/web/dist
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-agent-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      APP_URL: ${SERVICE_URL_APP}
      FRONTEND_URL: ${SERVICE_URL_APP}
      MASKIN_BACKEND_URL: ${SERVICE_URL_APP}
      # Analytics: the same PostHog project as production, so a test event is readable there.
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      POSTHOG_INTERNAL_WORKSPACE_IDS: ${POSTHOG_INTERNAL_WORKSPACE_IDS:-}
      # Stripe TEST mode only. The old dollar prices are required by boot; the DKK seat
      # prices are the current checkout lines and the ones the test subscription uses.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_STARTER_SEAT_DKK: ${STRIPE_PRICE_STARTER_SEAT_DKK:-}
      STRIPE_PRICE_PRO_SEAT_DKK: ${STRIPE_PRICE_PRO_SEAT_DKK:-}
      STRIPE_PRICE_ULTRA_BASE_DKK: ${STRIPE_PRICE_ULTRA_BASE_DKK:-}
      STRIPE_PRICE_ULTRA_SEAT_DKK: ${STRIPE_PRICE_ULTRA_SEAT_DKK:-}
      MASKIN_TRIAL_HARD_CAP_USD_CENTS: ${MASKIN_TRIAL_HARD_CAP_USD_CENTS:-286}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_data:
